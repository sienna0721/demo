/* =========================================================
 * 四、狀態管理：State Machine
 *   TITLE  開場畫面
 *   STORY  播劇情或提示（面板隱藏）
 *   ANSWER 等待作答（面板顯示）
 *   RESULT 結算畫面
 * ========================================================= */
const STATES = { TITLE: 'TITLE', STORY: 'STORY', ANSWER: 'ANSWER', RESULT: 'RESULT' };

const TRANSITIONS = {
  TITLE: ['STORY'],
  STORY: ['STORY', 'ANSWER', 'RESULT', 'TITLE'],
  ANSWER: ['STORY', 'TITLE'],
  RESULT: ['TITLE']
};

/*
 * 動態佇列（Queue-based State Machine）
 *   game.queue 裡放「關卡實例」，永遠只玩 queue[0]：
 *     答對整關 → shift() 移除，進下一關；佇列空了 → 結算
 *     忘記加 s → unshift() 插入追加提問，答對後 shift() 回到原題
 *   關卡實例 = { def: 關卡設定, main: 是否主線, introDone: 開場劇情播過沒, st: 作答進度 }
 *   作答進度放在實例上，所以追加提問插隊回來後，原題已答對的格子還在
 */
function makeLevel(def, main) {
  return {
    def,
    main,
    introDone: false,
    pending: [],           // 這關裡忘記加 s 的格子對應的追加題，通過這關後才插進佇列
    st: {
      choiceIndex: 0,      // 按鈕關目前作答到第幾題
      phase: 0,            // Boss 戰目前第幾招（0 起算）
      approach: 0,         // Boss 戰大野狼逼近了幾步（攻擊失敗累加、命中歸零）
      solved: {},          // 已答對的欄位
      values: {},          // 學生上次輸入的內容（答錯回來時保留，讓他修改）
      wrong: {},           // 上次答錯的欄位（重開面板時標紅）
      picked: {}           // 點擊合成：這格已選對的容器（接著選單複數）
    }
  };
}

function freshGame() {
  return {
    state: STATES.TITLE,
    queue: [],             // 關卡佇列
    remedialUsed: {},      // 已經觸發過追加提問的欄位（同一格只追加一次，避免無限插題）
    battle: null,          // Boss 戰狀態 { timeLeft, hearts, timer }
    failed: false,         // 在死亡畫面按了「放棄，看結算」
    stageHistory: [],      // 這一關的對話與錯誤圖片紀錄（倒轉回歸時倒著播放）
    checkpoint: null,      // 這一關開始時的狀態（生命值），死亡重試時恢復
    attempts: {}           // 每一格、每一種錯誤各錯幾次（決定提示追問到第幾層）
  };
}
let game = freshGame();

// 目前這一關（佇列最前面）的設定與作答進度
const D = () => game.queue[0].def;
const L = () => game.queue[0].st;

function setState(next) {
  if (!TRANSITIONS[game.state].includes(next)) {
    console.warn(`不合法的狀態轉移：${game.state} → ${next}`);
    return false;
  }
  game.state = next;
  return true;
}

// 錯誤類型（判斷函式回傳的 type）→ 錯題紀錄的四大類
const ERROR_CATEGORY = {
  choice: '可數與不可數',
  plural: '單複數', esRule: '單複數', extraS: '單複數',
  synonym: '用錯量詞', swapped: '用錯量詞', otherUnit: '用錯量詞', order: '用錯量詞',
  trap: '用錯量詞',       // 語意陷阱：用了意思不符合中文提示的字
  typo: '拼字錯誤', empty: '拼字錯誤',
  textbookOnly: null      // 課外但正確的單字：只提醒，不記錄
};

// 題目代號：主線關卡編號＋題目名稱（例：'3-salad-plural'）；追加題回傳 null（不記錄）
function questionId(name) {
  const n = STAGES.indexOf(D()) + 1;
  return n ? `${n}-${name}` : null;
}

// 答錯一次：用題目代號當 key 記下錯誤類別（同一題重複錯只覆蓋）
function recordError(qid, type) {
  if (!qid || !ERROR_CATEGORY[type]) return;
  errorRecords[qid] = ERROR_CATEGORY[type];
  ui.updateInfo();
}

function bumpAttempt(key) {
  game.attempts[key] = (game.attempts[key] || 0) + 1;
  return game.attempts[key];
}

// 英文複數：字尾 s、sh、ch、x 加 es；子音＋y 改 ies；其餘加 s
function pluralize(w) {
  if (/(s|sh|ch|x)$/.test(w)) return w + 'es';
  if (/[^aeiou]y$/.test(w)) return w.slice(0, -1) + 'ies';
  return w + 's';
}

// 複數轉單數（只處理本遊戲會用到的規則）：glasses→glass、dishes→dish、slices→slice、candies→candy
const IRREGULAR_SINGULAR = { loaves: 'loaf' };
function toSingular(w) {
  if (IRREGULAR_SINGULAR[w]) return IRREGULAR_SINGULAR[w];
  if (/(ss|sh|ch|x)es$/.test(w)) return w.slice(0, -2);
  if (/[^aeiou]ies$/.test(w)) return w.slice(0, -3) + 'y';
  if (/[^s]s$/.test(w)) return w.slice(0, -1);
  return w;
}

// 檢查輸入是否踩到這一格的語意陷阱（單數、複數都算）
function findTrap(field, input) {
  const t = field.semanticTraps || {};
  return t[input] || t[toSingular(input)] || null;
}

// 輸入淨化：轉小寫、去頭尾空白，中間多個空白壓成一個
function normalize(raw) {
  return raw.toLowerCase().trim().replace(/\s+/g, ' ');
}

/* =========================================================
 * 五、錯題引導邏輯（Socratic Scaffolding 動態提示樹）
 *
 * 原則：
 *   1. 絕對不直接說出答案
 *   2. 不只說「錯了」，而是指出錯在哪個概念，再丟一個問題讓學生自己想
 *   3. 同一格、同一種錯誤連犯，提示往下追問一層（tree 的下一句）
 * 判斷函式回傳 { ok, type, state, tree }
 *   type  錯誤類型，用來分開累計次數
 *   state Grandma 立繪要切換的狀態
 *   tree  提示樹，第 n 次犯同一種錯顯示第 n 句，到底就停在最後一句
 * ========================================================= */

/**
 * 按鈕關（關卡 2）：判斷 How much / How many
 */
function judgeChoice(q, choice) {
  if (choice === q.answer) return { ok: true };
  // 答錯：溫和的 Grandma 用謎語提示，再由 AI 家教引導（scenes：要播的整段對話）
  //   popcorn 選了 How many → 「奶奶眼睛不好數不了，抓一大把就好」
  //   candy 選了 How much → 「糖果不能像牛奶一樣倒，小袋子一袋一袋排好」
  return { ok: false, type: 'choice', state: 'hint', scenes: q.wrongScenes };
}

/**
 * 文字關（關卡 1、3、4、追加題）：依「中文提示」判斷單一輸入框（Context-Aware Validation）
 *
 * 判斷順序（每一步判斷到就 return，彼此互斥）：
 *   輸入淨化 ........ toLowerCase().trim()
 *   條件 1 完全正確 . 輸入 === correct ............................... ok
 *   （留白） ........ 還沒填 ......................................... empty        → spelling
 *   條件 2 語意陷阱 . 落在 semanticTraps（例：『片』填 loaf）......... trap         → synonym
 *   條件 3 課外同義 . 在 synonyms 且單複數正確（例：『片』填 pieces）. textbookOnly → 不計錯
 *   條件 4 單複數錯 . 寫對了字（correct 或 synonyms）但單複數錯 ...... plural / esRule / extraS → plural
 *   條件 5 其他 ..... 拼錯、亂碼 ..................................... typo         → spelling
 *
 * @param {object} stage 目前關卡設定（取本關的單複數提示）
 * @param {object} field 這一格的設定 { correct, hint_tw, synonyms, semanticTraps, plural, ... }
 * @param {string} raw   學生原始輸入
 */
function judgeFill(stage, field, raw) {
  const input = normalize(raw);
  const hint = field.hint_tw;
  const clue = `（提示：「${hint}」是 ${field.correct[0]} 開頭）`;
  const textbookWord = field.plural ? toSingular(field.correct) : field.correct;   // 課本單字的單數形

  // 條件 1：完全正確
  if (input === field.correct) return { ok: true };

  // 留白：還沒填（放在陷阱之前，否則空字串會落到條件 5 被當成亂碼）
  if (input === '') {
    return { ok: false, type: 'empty', state: 'hint', tree: [`「${hint}」那一格還空著喔！${clue}`] };
  }

  // 條件 2：語意陷阱——學生聯想到這個食物常用的字，但意思跟中文提示對不上
  const trap = findTrap(field, input);
  if (trap) return { ok: false, type: 'trap', state: 'hint', tree: [trap] };

  // 條件 3：符合中文提示的課外同義詞，而且單複數正確 → 正向肯定，拉回課本單字（不計錯）
  for (const syn of field.synonyms || []) {
    if (input === (field.plural ? pluralize(syn) : syn)) {
      return {
        ok: false, type: 'textbookOnly', state: 'hint',
        tree: [field.synonymMsg || `你能想到課本外的用法很棒喔！但本次請使用課本單字再試試看！${clue}`]
      };
    }
  }

  // 條件 4：單複數錯誤——字寫對了（課本單字或同義詞），但沒有依照前面的數量變化
  for (const word of [textbookWord, ...(field.synonyms || [])]) {
    const isTextbook = word === textbookWord;
    const note = isTextbook ? '' : `另外，這裡要用課本裡的單字${clue}。`;

    if (field.plural) {
      // 數字大於一：輸入了單數，或是該加 es 卻只加 s（glasss、dishs）
      const needsEs = pluralize(word) !== word + 's';
      if (input === word || (needsEs && input === word + 's')) {
        if (needsEs && isTextbook) {
          return {
            ok: false, type: 'esRule', state: 'hint',
            tree: [`容器拼對了，但這是單複數的問題！數字大於一要變複數，可是 ${word} 的字尾是 ${word.match(/(sh|ch|s|x)$/)[1]}，這種字的複數不是只加 s，而是加什麼呢？`]
          };
        }
        return {
          ok: false, type: 'plural', state: 'hint',
          tree: isTextbook
            ? [stage.hints?.plural || '容器拼對了，但這是單複數的問題！你看前面數字大於一，量詞本身也要加上 s 變身喔！',
               `還是單複數的問題喔！再看一次句子，前面的數字是幾？大於一的時候，${word} 後面要加上什麼才是「很多個」？`]
            : [`這是單複數的問題！前面的數字大於一，量詞要加 s 喔！${note}`]
        };
      }
    } else {
      // 只有一個（a / this）或不可數：卻加了 s
      if (input === pluralize(word) || input === word + 's' || input === word + 'es') {
        const msg = field.uncountable
          ? `這是單複數的問題！${word}（${hint}）是不可數名詞，不能一個一個數，所以不用加 s 喔！${note}`
          : `這是單複數的問題！前面是 ${field.cue || 'a'}，代表只有一個，不用加 s 喔！${note}`;
        return { ok: false, type: 'extraS', state: 'hint', tree: [msg] };
      }
    }
  }

  // 條件 5：其他拼字錯誤或亂碼
  return { ok: false, type: 'typo', state: 'angry', tree: [`再檢查一下拼字，並注意要不要加複數 s 喔！${clue}`] };
}

/**
 * 點擊合成（關卡 3、4）：判斷學生點的容器（只判斷「選哪種容器」，單複數下一步再判斷）
 *   選對容器 ........................ { ok }
 *   課外同義字（在 synonyms 裡）...... textbookOnly → 不計錯
 *   其他容器 ........................ trap → synonym，台詞用 reactions.wrong，沒寫就用 semanticTraps
 */
function judgeContainer(field, word) {
  const base = field.plural ? toSingular(field.correct) : field.correct;
  if (word === base) return { ok: true };
  if ((field.synonyms || []).includes(word)) {
    return { ok: false, type: 'textbookOnly', state: 'hint', line: '你能想到課本外的用法很棒喔！但本次請使用課本單字再試試看！' };
  }
  // reactions.wrong 是 [英文台詞, 中文翻譯]；沒寫到的容器才用語意陷阱的中文提示
  const custom = field.reactions && field.reactions.wrong && field.reactions.wrong[word];
  if (custom) return { ok: false, type: 'trap', state: 'hint', line: custom[0], sub: custom[1] };
  const trap = findTrap(field, word);
  return { ok: false, type: 'trap', state: 'hint', line: trap || `這不是奶奶要的呢，再看看提示『${field.hint_tw}』好嗎？` };
}

// 動畫卡片的說明文字，例如 "Milk shake in a Cup"
function craftCaption(field, word) {
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
  return (field.caption && field.caption(word)) || `${cap(field.food)} in a ${cap(word)}`;
}

/* =========================================================
 * 五之二、Boss 戰動作特效
 *   每一招一段動畫，用 Web Animations API（element.animate）在 #fx 圖層上播放。
 *   道具（麵粉袋、鹽罐、盤子）目前是 CSS 畫的色塊，之後可換成圖片。
 *   play(name, onHit)：播放該招，命中瞬間呼叫 onHit，整段播完後 resolve
 * ========================================================= */
const fx = {
  gen: 0,          // 世代號：clear() 時 +1，舊動畫 await 回來發現世代變了就不再產生東西
  layer() { return document.getElementById('fx'); },

  // 角色在 #game 座標系裡的「臉部」位置
  anchor(id) {
    const g = document.getElementById('game').getBoundingClientRect();
    const r = document.getElementById(id).getBoundingClientRect();
    return { x: r.left - g.left + r.width / 2, y: r.top - g.top + r.height * 0.35 };
  },

  spawn(cls, x, y, html = '') {
    const el = document.createElement('div');
    el.className = 'fx ' + cls;
    el.innerHTML = html;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    this.layer().appendChild(el);
    return el;
  },

  // 從 Red 丟向大野狼的拋物線（spin 是總共轉幾度）
  throwItem(cls, html, duration, spin) {
    const a = this.anchor('red');
    const b = this.anchor('npc');
    const el = this.spawn(cls, a.x, a.y, html);
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const c = 'translate(-50%, -50%)';
    return el.animate([
      { transform: `${c} translate(0, 0) rotate(0deg) scale(0.8)` },
      { transform: `${c} translate(${dx / 2}px, ${dy / 2 - 130}px) rotate(${spin / 2}deg) scale(1.1)` },
      { transform: `${c} translate(${dx}px, ${dy}px) rotate(${spin}deg) scale(1)` }
    ], { duration, easing: 'cubic-bezier(.4,0,.8,.6)' }).finished.then(() => el.remove());
  },

  // 擬聲字（中文），在命中點彈出
  word(text, x, y) {
    const el = this.spawn('fx-word', x, y, text);
    return el.animate([
      { transform: 'translate(-50%, -50%) scale(0.3) rotate(-12deg)', opacity: 0 },
      { transform: 'translate(-50%, -120%) scale(1.25) rotate(-6deg)', opacity: 1, offset: 0.25 },
      { transform: 'translate(-50%, -160%) scale(1) rotate(-6deg)', opacity: 0 }
    ], { duration: 1100, easing: 'ease-out' }).finished.then(() => el.remove());
  },

  // 第 1 招：麵粉袋飛過去，炸開一大團白煙
  async flour(onHit) {
    const gen = this.gen;
    await this.throwItem('fx-bag', 'FLOUR', 650, 300);
    if (gen !== this.gen) return;
    const b = this.anchor('npc');
    onHit();
    const puffs = [];
    for (let i = 0; i < 9; i++) {
      const p = this.spawn('fx-puff', b.x + (Math.random() - 0.5) * 140, b.y + (Math.random() - 0.5) * 120);
      puffs.push(p.animate([
        { transform: 'translate(-50%, -50%) scale(0.2)', opacity: 1 },
        { transform: `translate(-50%, -50%) scale(${2 + Math.random()})`, opacity: 0.9, offset: 0.35 },
        { transform: `translate(-50%, -80%) scale(${2.6 + Math.random()})`, opacity: 0 }
      ], { duration: 1600 + Math.random() * 500, delay: i * 40, easing: 'ease-out' }).finished.then(() => p.remove()));
    }
    puffs.push(this.word('噗——！', b.x, b.y - 60));
    await Promise.all(puffs);
  },

  // 第 2 招：鹽罐飛到大野狼頭上，鹽粒灑進眼睛
  async salt(onHit) {
    const gen = this.gen;
    const b = this.anchor('npc');
    const top = { x: b.x, y: b.y - 110 };
    const shaker = this.spawn('fx-shaker', this.anchor('red').x, this.anchor('red').y);
    await shaker.animate([
      { transform: 'translate(-50%, -50%) rotate(0deg)' },
      { transform: `translate(calc(-50% + ${top.x - this.anchor('red').x}px), calc(-50% + ${top.y - this.anchor('red').y}px)) rotate(160deg)` }
    ], { duration: 550, easing: 'ease-out', fill: 'forwards' }).finished;
    if (gen !== this.gen) { shaker.remove(); return; }
    // 鹽罐在頭上左右甩
    const shake = shaker.animate([
      { transform: `translate(calc(-50% + ${top.x - this.anchor('red').x - 14}px), calc(-50% + ${top.y - this.anchor('red').y}px)) rotate(150deg)` },
      { transform: `translate(calc(-50% + ${top.x - this.anchor('red').x + 14}px), calc(-50% + ${top.y - this.anchor('red').y}px)) rotate(200deg)` }
    ], { duration: 160, iterations: 7, direction: 'alternate' });
    onHit();
    const grains = [];
    for (let i = 0; i < 46; i++) {
      const g = this.spawn('fx-grain', top.x + (Math.random() - 0.5) * 50, top.y + 14);
      const fall = 90 + Math.random() * 70;
      const drift = (Math.random() - 0.5) * 120;
      grains.push(g.animate([
        { transform: 'translate(-50%, -50%)', opacity: 1 },
        { transform: `translate(calc(-50% + ${drift}px), calc(-50% + ${fall}px))`, opacity: 0 }
      ], { duration: 700 + Math.random() * 400, delay: Math.random() * 900, easing: 'ease-in' }).finished.then(() => g.remove()));
    }
    grains.push(this.word('沙沙沙！', b.x + 70, b.y - 40));
    await Promise.all(grains);
    shake.cancel();
    shaker.remove();
  },

  // 第 3 招：盤子旋轉飛過去，命中閃光、大野狼被打飛
  async plate(onHit) {
    const gen = this.gen;
    await this.throwItem('fx-plate', '', 520, 1080);
    if (gen !== this.gen) return;
    const b = this.anchor('npc');
    onHit();
    const flash = this.spawn('fx-flash', b.x, b.y);
    const shards = [];
    for (let i = 0; i < 10; i++) {
      const s = this.spawn('fx-shard', b.x, b.y);
      const ang = Math.random() * Math.PI * 2;
      const dist = 90 + Math.random() * 80;
      shards.push(s.animate([
        { transform: 'translate(-50%, -50%) rotate(0deg)', opacity: 1 },
        { transform: `translate(calc(-50% + ${Math.cos(ang) * dist}px), calc(-50% + ${Math.sin(ang) * dist}px)) rotate(${Math.random() * 720}deg)`, opacity: 0 }
      ], { duration: 800, easing: 'ease-out' }).finished.then(() => s.remove()));
    }
    await Promise.all([
      flash.animate([
        { transform: 'translate(-50%, -50%) scale(0.2)', opacity: 1 },
        { transform: 'translate(-50%, -50%) scale(1.6)', opacity: 0 }
      ], { duration: 600, easing: 'ease-out' }).finished.then(() => flash.remove()),
      this.word('匡噹！', b.x, b.y - 60),
      ...shards
    ]);
  },

  play(name, onHit) {
    return this[name](onHit);
  },

  // 盲打一擊：把題目的食物（SVG）丟過去，命中時噴濺＋-999 CRITICAL!
  async attack(atk, onHit) {
    const gen = this.gen;
    const art = {
      loaf: () => svgIcon('loaf', 74),
      pizza: () => svgIcon('pizzaSlice', 70),
      candy: () => svgIcon('bag', 62),
      tea: () => renderSituation('tea', 'cup').outerHTML,
      shake: () => renderSituation('shake', 'glass').outerHTML,
      salad: () => renderSituation('salad', 'bowl').outerHTML
    };
    await Promise.all(atk.throw.map((k, i) => new Promise(r => setTimeout(r, i * 180))
      .then(() => this.throwItem('fx-icon', art[k](), 520, 540 + i * 180))));
    if (gen !== this.gen) return;
    const b = this.anchor('npc');
    onHit();
    const flash = this.spawn('fx-flash', b.x, b.y);
    const bits = [];
    for (let i = 0; i < 14; i++) {
      const d = this.spawn('fx-dot', b.x, b.y);
      d.style.background = atk.color;
      const ang = Math.random() * Math.PI * 2;
      const dist = 70 + Math.random() * 90;
      bits.push(d.animate([
        { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
        { transform: `translate(calc(-50% + ${Math.cos(ang) * dist}px), calc(-50% + ${Math.sin(ang) * dist}px)) scale(.4)`, opacity: 0 }
      ], { duration: 700, easing: 'ease-out' }).finished.then(() => d.remove()));
    }
    const dmg = this.spawn('fx-dmg', b.x, b.y - 40, '-999<small>CRITICAL!</small>');
    await Promise.all([
      flash.animate([{ transform: 'translate(-50%, -50%) scale(.2)', opacity: 1 }, { transform: 'translate(-50%, -50%) scale(1.7)', opacity: 0 }],
        { duration: 600, easing: 'ease-out' }).finished.then(() => flash.remove()),
      dmg.animate([
        { transform: 'translate(-50%, -50%) scale(.2) rotate(-10deg)', opacity: 0 },
        { transform: 'translate(-50%, -80%) scale(1.35) rotate(-6deg)', opacity: 1, offset: 0.2 },
        { transform: 'translate(-50%, -110%) scale(1) rotate(-6deg)', opacity: 1, offset: 0.75 },
        { transform: 'translate(-50%, -150%) scale(1) rotate(-6deg)', opacity: 0 }
      ], { duration: 1400, easing: 'ease-out' }).finished.then(() => dmg.remove()),
      ...bits
    ]);
  },

  clear() {
    const l = this.layer();
    this.gen++;
    if (l) l.innerHTML = '';
  }
};

/* =========================================================
 * 六、UI 渲染層：只負責畫面，不做對錯判斷
 * ========================================================= */
const $ = id => document.getElementById(id);

const ui = {
  typing: false,
  typeTimer: null,
  segs: [],
  total: 0,
  currentLine: null,
  queue: [],
  onQueueDone: null,
  npcChar: 'mom',
  npcState: 'normal',

  SCENE_NAME: { home: 'Red 的家', room: '奶奶的房間', kitchen: '廚房', battle: 'Boss 戰', end: '真相大白' },

  speakerName(speaker) {
    if (speaker === 'npc') return this.npcState === 'wolf' || this.npcState === 'hurt' ? 'Big Bad Wolf' : 'Grandma';
    return { red: 'Red', think: 'Red（心想）', mom: 'Mom', tutor: 'AI 家教', narr: '旁白' }[speaker];
  },

  // 對白的 speaker 對應到語音角色
  voiceOf(speaker) {
    return { red: 'red', think: 'tutor', mom: 'mom', npc: 'grandma', tutor: 'tutor', narr: 'narr' }[speaker];
  },

  setScene(name) {
    this.scene = name;
    $('stage').className = 'scene-' + name;
    $('scene-label').textContent = '場景：' + this.SCENE_NAME[name];
  },

  // 切換右側 NPC 的角色與表情
  setNpc(char = this.npcChar, state = this.npcState) {
    this.npcChar = char;
    this.npcState = state;
    const el = $('npc');
    const dim = el.classList.contains('dim');
    el.className = `sprite char-${char} state-${state}` + (dim ? ' dim' : '');
    $('npc-label').textContent = char === 'mom' ? 'Mom 媽媽'
      : (state === 'wolf' || state === 'hurt') ? 'Big Bad Wolf 大野狼' : 'Grandma（戴口罩）';
  },

  focusSpeaker(speaker) {
    const isRed = speaker === 'red' || speaker === 'think';   // 內心戲也是 Red 在想
    $('red').classList.toggle('dim', !isRed);
    $('npc').classList.toggle('dim', isRed);
  },

  // 畫面劇烈震動（重設 class 讓動畫能重播）
  quake() {
    const g = $('game');
    g.classList.remove('quake');
    void g.offsetWidth;
    g.classList.add('quake');
  },

  updateInfo() {
    let label = '準備中';
    if (game.state === STATES.RESULT) label = '結算';
    else if (game.queue.length) {
      // 主線第幾關 = 總關數 - 佇列裡還剩幾個主線關 + 1
      const left = game.queue.filter(x => x.main).length;
      const n = STAGES.length - left + 1;
      label = game.queue[0].main ? `關卡 ${n} / ${STAGES.length}` : '追加題';
    }
    $('info-stage').textContent = label;
    $('info-err').textContent = `錯題 ${errorTotal()} 題`;
  },

  updateMute() {
    $('mute-btn').innerHTML = soundOn ? '🔊<span class="btn-long"> 音效開</span>' : '🔇<span class="btn-long"> 音效關</span>';
  },

  // 大野狼血條（n = 剩幾格；0 以上顯示，null 隱藏）
  setHp(n) {
    const bar = $('boss-hp');
    bar.classList.toggle('show', n !== null);
    bar.querySelectorAll('.seg').forEach((s, i) => s.classList.toggle('lost', n === null || i >= n));
  },

  // 顯示廚房層架（items 是 SHELF_ITEMS 的 key；null 隱藏）
  showShelf(items) {
    const shelf = $('kitchen-shelf');
    $('game').classList.toggle('shelf-on', !!items);
    shelf.classList.toggle('show', !!items);
    shelf.classList.remove('active');
    shelf.innerHTML = (items || []).map(k =>
      `<button class="shelf-item" type="button" data-item="${k}">${svgIcon(SHELF_ITEMS[k].icon, 56)}<span class="word">${k}</span></button>`).join('');
  },
  // 層架可不可以點（只有等學生選容器時才可以）
  setShelfActive(on) {
    $('kitchen-shelf').classList.toggle('active', on);
  },

  // 小紅帽生命值（n = 剩幾顆心；null 隱藏）
  setLife(n) {
    const el = $('info-favor');
    el.hidden = n === null;
    if (n !== null) el.innerHTML = `<span class="fav-long">生命值</span><span class="fav-short">HP</span> ${'♥'.repeat(n)}${'♡'.repeat(RED_MAX_HP - n)}`;
  },

  /**
   * 合成動畫：畫面中央彈出卡片，約 1.6 秒後收起
   * @param {'right'|'wrong'} kind 對或錯
   */
  craftFx(kind, item, food, caption, sub) {
    const box = $('craft-fx');
    // 動態組合「食物 × 容器」的情境圖（Boss 戰沒有食物，只畫道具）
    const sit = renderSituation(food, item);
    box.querySelector('.craft-icons').replaceChildren(sit);
    game.stageHistory.push({ t: 'img', html: sit.outerHTML, caption });   // 錯誤／正確的組合圖也記進歷史
    box.querySelector('.craft-caption').textContent = caption;
    box.querySelector('.craft-sub').textContent = sub || '';
    box.className = kind;
    void box.offsetWidth;          // 重新觸發動畫
    box.classList.add('show');
    return new Promise(resolve => setTimeout(() => {
      box.classList.remove('show');
      setTimeout(resolve, 250);
    }, 1600));
  },

  // 小紅帽愛心條（n = 剩幾顆；null 隱藏）
  setHearts(n) {
    const box = $('red-hearts');
    box.classList.toggle('show', n !== null);
    box.classList.toggle('last', n === 0);
    box.innerHTML = n === null ? '' : Array.from({ length: RED_MAX_HEARTS },
      (_, i) => `<span class="heart ${i < n ? '' : 'lost'}">♥</span>`).join('');
  },

  // 更新面板上的倒數計時
  updateTimer() {
    const t = game.battle && game.battle.timeLeft;
    const box = document.querySelector('#panel .timer');
    if (!box || t == null) return;
    box.querySelector('.timer-num').textContent = `${Math.ceil(t)} 秒`;
    box.querySelector('.timer-fill').style.width = `${(t / game.battle.limit) * 100}%`;
    box.classList.toggle('warn', t <= 10);
  },

  // 命中：大野狼閃光後退，逼近的距離歸零
  hitNpc() {
    const el = $('npc');
    el.style.translate = '';
    el.classList.remove('hit');
    void el.offsetWidth;
    el.classList.add('hit');
  },

  // 打字機特效：逐字顯示（保留課本單字粗體），同時呼叫 speakText 播該角色的語音
  typeLine(line) {
    if (line.scene) this.setScene(line.scene);
    if (line.char || line.state) this.setNpc(line.char, line.state);
    if (line.quake) this.quake();
    if ('hp' in line) this.setHp(line.hp);
    if (line.music === 'start') music.play();
    if (line.music === 'fade') music.fadeOut();
    // 教學圖解：台詞帶 icon（ICONS 的名稱）就在對話框右側顯示，沒有就收起來
    $('dialogue').classList.toggle('has-icon', !!line.icon);
    $('dialogue-icon').innerHTML = line.icon ? svgIcon(line.icon, 112) + `<div class="di-label">${line.iconLabel || ''}</div>` : '';
    const sp = $('speaker');
    sp.textContent = this.speakerName(line.speaker);
    sp.className = line.speaker === 'red' ? '' : line.speaker;
    this.focusSpeaker(line.speaker);

    // 記進這一關的歷史，死亡倒轉時倒著播
    game.stageHistory.push({ t: 'line', speaker: line.speaker, text: line.text.replace(/<\/?strong>/g, ''),
      scene: this.scene, char: this.npcChar, state: this.npcState });
    this.currentLine = line;
    this.segs = toSegments(line.text);
    this.total = this.segs.reduce((n, sg) => n + sg.t.length, 0);   // 不含 <strong> 標籤本身
    $('text').innerHTML = '';
    $('sub').innerHTML = '';
    $('next-arrow').classList.remove('show');
    speakText(line.text, this.voiceOf(line.speaker));

    this.typing = true;
    let i = 0;
    clearInterval(this.typeTimer);
    this.typeTimer = setInterval(() => {
      $('text').innerHTML = renderSegments(this.segs, ++i);
      if (i >= this.total) this.finishTyping();
    }, 32);
  },

  finishTyping() {
    clearInterval(this.typeTimer);
    this.typing = false;
    $('text').innerHTML = renderSegments(this.segs);
    $('sub').innerHTML = this.currentLine.sub ? renderSegments(toSegments(this.currentLine.sub)) : '';
    if (this.queue.length > 0 || this.onQueueDone) $('next-arrow').classList.add('show');
  },

  play(lines, done) {
    this.queue = lines.slice();
    this.onQueueDone = done || null;
    this.advance();
  },

  advance() {
    if (this.typing) { this.finishTyping(); return; }
    if (this.queue.length > 0) { this.typeLine(this.queue.shift()); return; }
    if (this.onQueueDone) {
      const cb = this.onQueueDone;
      this.onQueueDone = null;
      $('next-arrow').classList.remove('show');
      cb();
    }
  },

  // 中斷所有劇情（回到主頁用）
  stopAll() {
    clearInterval(this.typeTimer);
    this.typing = false;
    this.queue = [];
    this.onQueueDone = null;
    $('text').innerHTML = '';
    $('sub').innerHTML = '';
    $('next-arrow').classList.remove('show');
    $('dialogue').classList.remove('has-icon');
    fx.clear();
    $('game').classList.remove('danger', 'hell');
    this.showShelf(null);
    this.setLife(null);
    $('craft-fx').className = '';
    this.setHp(null);
    this.setHearts(null);
    stopBattleTimer();
    $('you-died').classList.remove('show');
    $('red').classList.remove('down');
    $('npc').classList.remove('lunge');
    $('npc').style.translate = '';
    clearInterval(this.rewindTimer);
    $('rewind-overlay').classList.remove('show');
    $('game').classList.remove('rewinding');
  },

  // 倒轉回歸的一格畫面：還原當時的場景、立繪、說話者與台詞（不唸語音、不打字），圖片放中央
  showFrame(f) {
    if (!f) return;
    if (f.t === 'img') { $('rewind-frame').innerHTML = f.html; return; }
    $('rewind-frame').innerHTML = '';
    if (f.scene) this.setScene(f.scene);
    this.setNpc(f.char, f.state);
    $('speaker').textContent = this.speakerName(f.speaker);
    $('speaker').className = f.speaker === 'red' ? '' : f.speaker;
    this.focusSpeaker(f.speaker);
    $('text').textContent = f.text;
    $('sub').textContent = '';
  },

  // 面板：作答時才出現，送出後立刻 display:none
  showPanel(html, battle = false) {
    const p = $('panel');
    p.innerHTML = html;
    p.classList.toggle('battle', battle);
    p.classList.remove('hidden');
  },
  hidePanel() {
    $('panel').classList.add('hidden');
  },

  renderChoice(stage) {
    const rows = stage.questions.map((q, i) => {
      const done = i < L().choiceIndex;
      const cls = done ? 'done' : i === L().choiceIndex ? 'active' : '';
      return `<div class="q-line ${cls}"><span class="blank">${done ? q.answer : '&nbsp;'}</span>${q.after}</div>`;
    }).join('');
    this.showPanel(`
      <div class="panel-title">${stage.title}</div>
      <div class="who">${stage.who}</div>
      ${rows}
      <div class="choice-row">
        <button class="btn" type="button" data-choice="How much">How much</button>
        <button class="btn alt" type="button" data-choice="How many">How many</button>
      </div>`);
  },

  // 文字關：句子裡的 {id} 換成輸入框
  renderFill(stage) {
    const slot = f => {
      const solved = L().solved[f.id];
      const cls = solved ? 'ok' : L().wrong[f.id] ? 'bad' : '';
      const val = solved ? f.correct : (L().values[f.id] || '');
      const letters = f.letters ? `<span class="letters">${f.letters}</span>` : '';
      return `<span class="slot">${letters}<input class="word-input ${cls}" id="in-${f.id}"
        value="${val.replace(/"/g, '&quot;')}" ${solved ? 'disabled' : ''}
        autocomplete="off" autocapitalize="off" spellcheck="false"></span>`;
    };
    const lines = [].concat(stage.sentence).map(s => {
      let html = s;
      stage.fields.forEach(f => { html = html.replace(`{${f.id}}`, slot(f)); });
      html = html.replace(/\(([^()]+)\)/g, '<span class="zh-tag">($1)</span>');
      return `<div class="q-line">${html}</div>`;
    }).join('');
    this.showPanel(`
      <div class="panel-title">${stage.title}</div>
      <div class="who">${stage.who}</div>
      ${lines}
      <div class="choice-row"><button class="btn" type="button" id="submit-btn">送出</button></div>`);
    // 游標放在答錯的那格，沒有就放第一個還沒答對的格子
    const target = stage.fields.find(f => L().wrong[f.id] && !L().solved[f.id])
      || stage.fields.find(f => !L().solved[f.id]);
    if (target) setTimeout(() => $('in-' + target.id).focus(), 50);
  },

  /*
   * 點擊合成面板（關卡 3、4）：一次處理一格
   *   還沒選容器 → 空格標示「從層架選」，層架可以點
   *   已選對容器 → 空格顯示容器，下方出現單複數按鈕（例：glass / glasss / glasses）
   */
  renderCraft(stage) {
    const cur = stage.fields.find(f => !L().solved[f.id]);
    const picked = cur && L().picked[cur.id];
    let html = stage.sentence;
    stage.fields.forEach(f => {
      let blank;
      if (L().solved[f.id]) blank = `<span class="pick-blank done">${f.correct}</span>`;
      else if (f === cur) blank = `<span class="pick-blank active">${picked || '👆 從層架選'}</span>`;
      else blank = `<span class="pick-blank">&nbsp;</span>`;
      html = html.replace(`{${f.id}}`, blank);
    });
    html = html.replace(/\(([^()]+)\)/g, '<span class="zh-tag">($1)</span>');
    let action;
    if (picked) {
      // 單複數的選項：單數、多加 s、正確的複數（去重複後打亂順序）
      const forms = [...new Set([picked, picked + 's', pluralize(picked)])].sort(() => Math.random() - 0.5);
      action = `<div class="pick-note">容器選對了！看看前面的數量，要不要加 s？</div>
        <div class="form-row">${forms.map(w => `<button class="btn alt form-btn" type="button" data-form="${w}">${w}</button>`).join('')}</div>`;
    } else {
      action = `<div class="pick-note">點上方層架的容器，幫 Grandma 裝「${cur.food}」</div>`;
    }
    this.showPanel(`
      <div class="panel-title">${stage.title}</div>
      <div class="who">${stage.who}</div>
      <div class="q-line">${html}</div>
      ${action}`);
    this.setShelfActive(!picked);
  },

  // Boss 戰開打前：難度選擇
  renderDifficulty(stage) {
    this.showPanel(`
      <div class="panel-title">${stage.title}選擇難度</div>
      <div class="diff-pick">
        ${Object.entries(DIFFICULTY).map(([k, d]) => `
          <button class="diff-btn diff-${k}" type="button" data-diff="${k}">
            <b>${d.name}</b><span>${d.desc}</span>
          </button>`).join('')}
      </div>
      <div class="pick-note">每擊中一招，倒數就重置；任何一招時間歸零就失敗</div>`, true);
  },

  /*
   * Boss 戰盲打面板：大字中文提示＋每個字母一條底線（不顯示英文、沒有輸入框）
   *   打字由 document 的 keydown 全局監聽（觸控裝置另外顯示一排字母按鈕）
   */
  renderBattle(stage) {
    const bt = game.battle;
    const d = DIFFICULTY[bt.diff];
    const total = bt.attacks.length;
    const atk = bt.attacks[bt.idx];
    const hp = total - bt.idx;
    const wolfHp = bt.attacks.map((_, i) => `<span class="mini-seg ${i < hp ? '' : 'lost'}"></span>`).join('');
    const touch = window.matchMedia('(pointer: coarse)').matches;
    const keyboard = touch
      ? `<div class="vkb">${['qwertyuiop', 'asdfghjkl', 'zxcvbnm'].map(row =>
          `<div class="vkb-row">${[...row].map(k => `<button class="vk" type="button" data-key="${k}">${k}</button>`).join('')}</div>`).join('')}</div>`
      : '';
    const note = d.hint ? '灰色字母是提示，也要打出來喔' : d.penalty ? `打錯一個字母扣 ${d.penalty} 秒！` : '全底線盲打，靠記憶拼出來！';
    this.showPanel(`
      <div class="battle-head">
        <span class="panel-title">${stage.title}第 ${bt.idx + 1} 擊 / ${total}</span>
        <span class="diff-tag diff-${bt.diff}">${d.name}</span>
        <span class="mini-hp">大野狼 HP ${wolfHp}</span>
      </div>
      <div class="timer"><span>⏱</span><div class="timer-bar"><div class="timer-fill"></div></div><span class="timer-num"></span></div>
      <div class="atk-zh">【${atk.zh}】</div>
      <div id="type-line"></div>
      <div class="pick-note" id="type-note">${touch ? '點下方字母' : '直接用鍵盤打字'}，不用按空白鍵｜${note}</div>
      ${keyboard}`, true);
    this.updateTyping();
    this.updateTimer();
  },

  /*
   * 依目前進度重畫底線
   *   打出的字母：金色高光（.typed-char）
   *   Easy 的提示字母（每個字的頭尾）：還沒打時顯示灰色字（.hint-char）
   *   其他：只有底線（.untyped-char）
   */
  updateTyping(hitIndex = -1) {
    const bt = game.battle;
    const en = bt.attacks[bt.idx].en;
    const hints = new Set();
    if (DIFFICULTY[bt.diff].hint) {
      let start = 0;
      for (const w of en.split(' ')) { hints.add(start); hints.add(start + w.length - 1); start += w.length + 1; }
    }
    $('type-line').innerHTML = [...en].map((ch, i) => {
      if (ch === ' ') return '<span class="tc gap"></span>';
      const done = i < bt.pos;
      const cls = done ? 'typed-char' : hints.has(i) ? 'hint-char' : 'untyped-char';
      return `<span class="tc ${cls}${i === bt.pos ? ' cursor' : ''}${i === hitIndex ? ' pop' : ''}">${done || hints.has(i) ? ch : '&nbsp;'}</span>`;
    }).join('');
  },

  // 打錯：整串字閃紅光
  flashTypingError() {
    const el = $('type-line');
    el.classList.remove('miss');
    void el.offsetWidth;
    el.classList.add('miss');
  },

  // Hard 難度扣秒：倒數旁跳出紅色「-2s」
  timerPenalty(sec) {
    const box = document.querySelector('#panel .timer');
    if (!box) return;
    const tag = document.createElement('span');
    tag.className = 'timer-pen';
    tag.textContent = `-${sec}s`;
    box.appendChild(tag);
    setTimeout(() => tag.remove(), 900);
  },

  /*
   * 結算畫面
   *   全部依 errorRecords（去重後的錯題）判定：
   *   評價稱號：去重總錯題數 0 → 傳說級外送員；1～3 → 優秀特務；4 以上 → 見習生；稱號下方註明弱點類別
   *   在死亡畫面按「放棄，看結算」→ 挑戰失敗
   *   戰鬥數據面板：每一類顯示「錯題數 / TOTAL_QUESTIONS 總題數」，0 錯加閃爍的 ✨ PERFECT!
   *   精準推播：看哪一類錯題最多（平手依 單複數 → 可數與不可數 → 拼字錯誤 → 用錯量詞 的順序）
   *     單複數       → 均一：名詞複數與容器量詞規則
   *     可數與不可數 → 均一：可數與不可數名詞判斷
   *     拼字錯誤     → 單字拼寫大挑戰 ＋ 解鎖「大野狼單字打字機」
   *     用錯量詞     → 錯在容器選錯，同樣推「名詞複數與容器量詞規則」
   *     全對         → 直接解鎖新挑戰當獎勵
   *   死亡 4 次以上另外提醒多練拼寫
   */
  renderResult() {
    $('game').classList.add('ending');
    const total = errorTotal();
    const failed = game.failed;
    const ORDER = ['單複數', '可數與不可數', '拼字錯誤', '用錯量詞'];
    const counts = Object.fromEntries(ORDER.map(k => [k, errorCount(k)]));
    const max = Math.max(...ORDER.map(k => counts[k]));
    // 失敗但一題都沒錯（純粹時間到）→ 算打字速度不夠，走拼字練習那條
    const topCat = total === 0 ? (failed ? '拼字錯誤' : null) : ORDER.find(k => counts[k] === max);
    const top = { '單複數': 'plural', '可數與不可數': 'uncountable', '拼字錯誤': 'spelling', '用錯量詞': 'synonym' }[topCat] || null;

    let badge;
    if (failed) badge = { cls: 'novice', text: '💀 挑戰失敗', en: 'Mission Failed' };
    else if (total === 0) badge = { cls: 'legend', text: '🏆 傳說級外送員', en: 'Legendary Courier' };
    else if (total <= 3) badge = { cls: 'agent', text: '🥇 優秀特務', en: 'Excellent Agent' };
    else badge = { cls: 'novice', text: '🥉 見習生', en: 'Novice Learner' };
    const weak = total > 0 ? `<div class="weak">弱點：${topCat}（${counts[topCat]} 題）</div>` : '';

    // 戰鬥數據面板：錯題數 / 總題數，0 錯的類別閃 PERFECT
    const stats = ORDER.map(k => `<div class="stat-row"><span>${k}</span><b>${counts[k]} / ${TOTAL_QUESTIONS[k]}</b>`
      + `${counts[k] === 0 ? '<span class="perfect">✨ PERFECT!</span>' : ''}</div>`).join('');

    // 影片：YouTube 嵌入＋均一原網址的備用按鈕（直接雙擊開檔時 YouTube 可能拒播，按鈕一定能開）
    const video = (url, title) => url
      ? `<div class="video-frame"><iframe title="${title}" src="${toEmbedUrl(url)}" referrerpolicy="strict-origin-when-cross-origin"
           allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
         <a class="video-link" href="${url}" target="_blank" rel="noopener">▶ 影片播不出來？到均一平台觀看</a>`
      : `<div class="video-frame"><iframe title="${title}" srcdoc="<body style='margin:0;display:flex;align-items:center;justify-content:center;height:100vh;background:#222;color:#ddd;font-family:sans-serif;text-align:center'><div>${title}<br><small>請在程式最上方填入影片網址</small></div></body>"></iframe></div>`;
    const unlock = `
        <button class="btn unlock-btn" type="button" id="unlock-btn">🎉 解鎖新挑戰：大野狼的單字打字機 🎉</button>
        <div id="minigame">小遊戲開發中，敬請期待...</div>`;

    let branch;
    if (top === 'plural' || top === 'synonym') {
      branch = `
        <div class="advice">${top === 'plural' ? '你最常忘記幫量詞加 s，' : '你最常選錯容器、用錯量詞，'}來看看量詞的規則吧！</div>
        <h3 class="rec-title">為你推薦｜均一平台：名詞複數與容器量詞規則</h3>
        ${video(JUNYI_VIDEO_PLURAL_URL, '均一平台：名詞複數與容器量詞規則')}
        <button class="btn" type="button" id="again-btn">再次挑戰</button>`;
    } else if (top === 'uncountable') {
      branch = `
        <div class="advice">How much 和 How many 你還有點混淆，先把可數與不可數弄清楚！</div>
        <h3 class="rec-title">為你推薦｜均一平台：可數與不可數名詞判斷</h3>
        ${video(JUNYI_VIDEO_UNCOUNTABLE_URL, '均一平台：可數與不可數名詞判斷')}
        <button class="btn" type="button" id="again-btn">再次挑戰</button>`;
    } else if (top === 'spelling') {
      branch = `
        <div class="advice">✍️ 單字拼寫大挑戰</div>
        <p class="rec-note">${failed && total === 0 ? '時間到了！觀念都對，只是打字還不夠快。' : '你的觀念大致都對，最常出錯的是拼字。'}用新遊戲練習打字，把單字拼熟！</p>
        ${unlock}
        <button class="btn alt" type="button" id="again-btn">再玩一次</button>`;
    } else {
      branch = `${unlock}
        <button class="btn alt" type="button" id="again-btn">再玩一次</button>`;
    }

    // 死亡 4 次以上：提醒多練拼寫，並一定附上打字機按鈕
    const tooManyDeaths = !failed && deathCount >= 4;
    if (tooManyDeaths) {
      branch = `<div class="advice">大野狼吃得好飽啊！用打字機再多練習拼寫吧！</div>`
        + (branch.includes('unlock-btn') ? branch : unlock + branch);
    }

    $('result-screen').innerHTML = `
      <div class="result-card">
        <h2>${failed ? '挑戰失敗……' : '任務完成！'}</h2>
        <div>${failed ? `放棄挑戰了……死亡 ${deathCount} 次、錯題 ${total} 題，看完推薦再挑戰一次吧` : `獲得成就（錯題 ${total} 題・死亡 ${deathCount} 次）`}</div>
        <div class="badge ${badge.cls}">${badge.text}<small>${badge.en}</small></div>
        ${weak}
        <h3 class="stats-title">📊 戰鬥數據（錯題數 / 總題數）</h3>
        <div class="stats">${stats}</div>
        <div class="review">
          <b>今天的重點</b><br>
          不可數（popcorn, water, flour, salt…）→ <b>How much</b> popcorn do you want?<br>
          可數的容器（bags, bowls, cups…）→ <b>How many</b> bags of candy do you need?<br>
          只有一個用 a：a <b>slice</b> of bread、a <b>bottle</b> of water<br>
          大於一要變複數：two <b>bowls</b>、three <b>glasses</b>（字尾是 s 加 es）、four <b>slices</b>、two <b>cups</b><br>
          冷飲用 <b>glass</b>（奶昔、果汁），熱飲用 <b>cup</b>（茶、咖啡）
        </div>
        ${branch}
      </div>`;
    $('result-screen').classList.add('show');
  }
};

/* =========================================================
 * 七、流程控制（串接資料層與 UI 層）
 * ========================================================= */
// 開新的一局：5 個主線關卡依序放進佇列
function startGame() {
  game.queue = STAGES.map(def => makeLevel(def, true));
  startLevel();
}

// 開始佇列最前面的關卡：第一次進來播開場劇情；追加提問插隊回來的，只講一句再開面板
function startLevel() {
  const lv = game.queue[0];
  setState(STATES.STORY);
  ui.updateInfo();
  if (lv.introDone) {
    ui.play([{ speaker: 'tutor', text: '回到剛才的題目，這次一定沒問題！' }], openPanel);
    return;
  }
  lv.introDone = true;
  // 檢查點：清空這一關的歷史，記下開始時的生命值（死亡重試時恢復）
  game.stageHistory = [];
  game.checkpoint = { hp: redHp };
  // 有層架設定的關卡（3、4）才顯示層架；Boss 戰以外都顯示生命值
  ui.showShelf(lv.def.shelf || null);
  ui.setLife(lv.def.type !== 'battle' ? redHp : null);
  // Boss 戰：先不決定難度，開場劇情播完跳出難度選擇
  if (lv.def.type === 'battle') game.battle = null;
  ui.play(lv.def.intro, openPanel);
}

// 選好難度：抽 3 道不重複的攻擊，第一招開始計時
function chooseDifficulty(diff) {
  const d = DIFFICULTY[diff];
  const pool = D().attackPool.slice().sort(() => Math.random() - 0.5);
  game.battle = {
    diff, limit: d.time, timeLeft: d.time, timer: null,
    attacks: pool.slice(0, 3),   // 本回合的 3 道攻擊指令
    idx: 0,                      // 第幾題
    pos: 0,                      // 這題打到英文字串的第幾個字元
    missThis: false,             // 這題打錯過沒（同一題只計一次拼字錯誤）
    combo: 0,                    // 連續打對幾個字母（打擊音效的音高跟著升）
    creep: 0                    // 大野狼已經逼近幾 px
  };
  $('game').classList.toggle('danger', diff === 'hard');   // 困難：紅色警戒濾鏡
  closePanel();
  ui.play([{ speaker: 'tutor', text: `${d.name}！每一招限時 ${d.time} 秒，開打！` }], openPanel);
}

/*
 * Boss 戰倒數：只在作答面板打開時倒數（openPanel 開始、closePanel 停止），
 * 動畫、提示播放時不扣時間；歸零就失敗
 */
function startBattleTimer() {
  stopBattleTimer();
  const bt = game.battle;
  let last = performance.now();
  bt.timer = setInterval(() => {
    const now = performance.now();
    const dt = (now - last) / 1000;
    bt.timeLeft = Math.max(0, bt.timeLeft - dt);
    last = now;
    ui.updateTimer();
    // 大野狼依難度一步步逼近（命中時被打退歸零）
    bt.creep = Math.min(170, bt.creep + dt * DIFFICULTY[bt.diff].creep);
    $('npc').style.translate = `${-bt.creep}px 0`;
    if (bt.timeLeft <= 0) {
      closePanel();
      die('time');
    }
  }, 100);
}

function stopBattleTimer() {
  if (game.battle && game.battle.timer) {
    clearInterval(game.battle.timer);
    game.battle.timer = null;
  }
}

/*
 * 死亡：deathCount +1，播失敗演出，跳出 YOU DIED（再次挑戰／放棄看結算）
 *   time  ：Boss 戰某一招倒數歸零 → 大野狼撲過來
 *   hp    ：生命值歸零（關卡 3、4 由 Grandma 心疼地叫小紅帽去休息，其他關卡是小紅帽體力耗盡）
 */
function die(reason) {
  stopBattleTimer();
  setState(STATES.STORY);
  ui.queue = [];
  ui.onQueueDone = null;
  deathCount++;
  ui.setShelfActive(false);

  if (reason === 'time') {
    music.fadeOut(1500);
    ui.setHp(null);
    ui.setNpc(undefined, 'wolf');
    // 大野狼衝到小紅帽面前：算出兩個立繪之間的距離
    const red = $('red').getBoundingClientRect();
    const npc = $('npc');
    const nr = npc.getBoundingClientRect();
    npc.classList.add('lunge');
    npc.style.translate = `${-(nr.left - red.right) - nr.width * 0.35}px 0`;
    ui.quake();
    ui.typeLine({ speaker: 'npc', text: 'I want a kid like you!', sub: '時間到了！大野狼撲了過來！' });
  } else {
    ui.quake();
    if (D().type === 'craft') ui.typeLine({ speaker: 'npc', state: 'hint', text: 'Oh, sweetie, you look so tired. Go and take a little rest, okay?', sub: '哎呀，小紅帽，妳看起來好累喔，先去休息一下好不好？（生命值歸零了……）' });
    else ui.typeLine({ speaker: 'narr', text: '答錯太多次，小紅帽體力耗盡，倒下了……', sub: '生命值歸零了……' });
  }

  const round = game;
  setTimeout(() => {
    if (game !== round) return;
    $('red').classList.add('down');
  }, 500);
  setTimeout(() => {
    if (game !== round) return;
    $('died-sub').textContent = reason === 'time' ? '時間到了……' : '生命值歸零了……';
    $('died-count').textContent = `第 ${deathCount} 次死亡`;
    $('you-died').classList.add('show');
    speech.stop();
  }, 1300);
}

// 倒轉音效：先播 assets 裡的 mp3，播不出來（檔案不存在等）就改用合成的倒帶聲
function playRewindSound() {
  if (!soundOn) return;
  let fallback = false;
  const useSynth = () => { if (!fallback) { fallback = true; sfx.rewind(); } };
  const a = new Audio(REWIND_SOUND_URL);
  a.addEventListener('error', useSynth);
  a.play().catch(useSynth);
}

/*
 * VHS 倒轉演出：把這一關的歷史（台詞、錯誤圖片）反過來，每 100 毫秒換一格往回倒
 *   畫面套錄影帶倒轉濾鏡＋雜訊，角落閃「⏪ REWIND」；播完移除覆蓋層
 */
function playRewindCinematic() {
  return new Promise(resolve => {
    const frames = game.stageHistory.slice(-60).reverse();
    while (frames.length < 12) frames.push(null);     // 歷史太短也至少倒 1.2 秒
    clearInterval(ui.typeTimer);
    ui.typing = false;
    ui.hidePanel();
    $('dialogue').classList.remove('has-icon');
    $('you-died').classList.remove('show');
    $('rewind-overlay').classList.add('show');
    $('game').classList.add('rewinding');
    playRewindSound();
    let i = 0;
    clearInterval(ui.rewindTimer);
    ui.rewindTimer = setInterval(() => {
      if (i >= frames.length) {
        clearInterval(ui.rewindTimer);
        setTimeout(() => {
          $('rewind-overlay').classList.remove('show');
          $('game').classList.remove('rewinding');
          $('rewind-frame').innerHTML = '';
          resolve();
        }, 250);
        return;
      }
      $('rw-time').textContent = `◀◀ 00:${String(frames.length - i).padStart(2, '0')}`;
      ui.showFrame(frames[i++]);
    }, 100);
  });
}

/*
 * 回到檢查點
 *   關卡 1～4：清空紀錄、生命值恢復成這關開始時的數值，從第一句開場對話重來
 *   關卡 5   ：跳回難度選擇，之後重新抽 3 道新題目
 */
function restartFromCheckpoint() {
  const cur = game.queue[0];
  const fresh = makeLevel(cur.def, cur.main);
  // 這一關登記過的追加題也一併清掉，重來時漏 s 會重新登記
  Object.keys(game.remedialUsed).filter(k => k.startsWith(cur.def.title + '-')).forEach(k => delete game.remedialUsed[k]);
  game.queue[0] = fresh;
  redHp = game.checkpoint ? game.checkpoint.hp : redHp;
  game.battle = null;
  fx.clear();
  $('craft-fx').className = '';
  $('red').classList.remove('down');
  $('npc').classList.remove('lunge');
  $('npc').style.translate = '';
  $('game').classList.remove('danger');
  if (cur.def.type === 'battle') {
    fresh.introDone = true;
    game.stageHistory = [];
    ui.setScene('battle');
    ui.setNpc('grandma', 'wolf');
    ui.setHp(3);
    music.play();
    setState(STATES.STORY);
    ui.play([{ speaker: 'tutor', text: '時間倒轉回來了……這次換一組新題目，選好難度再戰一次！' }], openPanel);
    return;
  }
  startLevel();
}

function retryAfterDeath() {
  const round = game;
  playRewindCinematic().then(() => { if (game === round) restartFromCheckpoint(); });
}

function giveUpAfterDeath() {
  $('you-died').classList.remove('show');
  game.failed = true;
  showResult();
}

// 進入作答節點：面板出現
function openPanel() {
  if (!setState(STATES.ANSWER)) return;
  const stage = D();
  if (stage.type === 'choice') ui.renderChoice(stage);
  else if (stage.type === 'battle') {
    if (!game.battle) { ui.renderDifficulty(stage); return; }   // 還沒選難度
    ui.renderBattle(stage);
    startBattleTimer();
  }
  else if (stage.type === 'craft') ui.renderCraft(stage);
  else ui.renderFill(stage);
}

// 作答送出：面板立刻隱藏，回到劇情狀態
function closePanel() {
  stopBattleTimer();
  ui.setShelfActive(false);
  ui.hidePanel();
  setState(STATES.STORY);
}

/*
 * 答錯：用題目代號 qid 記進 errorRecords（去重），換提示，點一下後面板再出現，原題重答
 *   忘記加 s 且這格有追加題 → 先記在這關的 pending，等這關通過後才插進佇列
 *   課外但正確的單字（textbookOnly）→ 只提醒：不計錯、不扣生命值
 *   其他答錯 → 生命值 -1，扣到 0 就死亡
 */
function giveHint(res, key, qid) {
  recordError(qid, res.type);
  if (ERROR_CATEGORY[res.type] && D().type !== 'battle') {
    redHp = Math.max(0, redHp - 1);
    ui.setLife(redHp);
    if (redHp <= 0) { die('hp'); return; }
  }
  const tries = bumpAttempt(key);
  ui.setNpc(undefined, res.state);
  // 有整段劇情（第二關的喜劇反應）就播劇情，否則由 AI 家教講提示樹的對應那一句
  if (res.scenes) {
    const scene = res.scenes[Math.min(tries, res.scenes.length) - 1].map(l => ({ ...l }));
    const last = scene[scene.length - 1];
    last.sub = (last.sub ? last.sub + ' ' : '') + '（點一下繼續作答）';   // 有中文翻譯就接在後面
    ui.play(scene, openPanel);
    return;
  }
  const line = res.tree[Math.min(tries, res.tree.length) - 1];
  ui.play([{ speaker: 'tutor', text: line, sub: '（點一下繼續作答）' }], openPanel);
}

// 記下這關通過後要補的追加題：漏 s 且這格有追加題（同一格只登記一次，同一道追加題不重複）
function notePending(field, res) {
  const lv = game.queue[0];
  const usedKey = `${lv.def.title}-${field.id}`;
  if (ERROR_CATEGORY[res.type] !== '單複數' || !field.remedial || game.remedialUsed[usedKey]) return;
  game.remedialUsed[usedKey] = true;
  if (!lv.pending.includes(field.remedial)) lv.pending.push(field.remedial);
}

/*
 * 這一關全部答對：播放正確音效，播完劇情後 shift() 移出佇列；
 * 這關有待補的追加題 → unshift() 插到佇列最前面（在下一個主線關卡之前）
 */
function clearLevel() {
  sfx.correct();
  ui.play(D().done, () => {
    const cleared = game.queue.shift();
    cleared.pending.slice().reverse()
      .forEach(k => game.queue.unshift(makeLevel(REMEDIAL[k], false)));
    if (game.queue.length) startLevel();
    else showResult();
  });
}

function showResult() {
  setState(STATES.RESULT);
  $('game').classList.remove('danger', 'hell');
  ui.showShelf(null);
  ui.setLife(null);
  speech.stop();
  ui.updateInfo();
  ui.renderResult();
}

function handleChoice(choice) {
  const stage = D();
  const q = stage.questions[L().choiceIndex];
  closePanel();
  const res = judgeChoice(q, choice);
  if (!res.ok) { giveHint(res, `choice-${q.id}`, questionId(q.id)); return; }

  L().choiceIndex++;
  const last = L().choiceIndex >= stage.questions.length;
  if (last) { ui.play(q.okLines, clearLevel); return; }
  sfx.correct();
  ui.play(q.okLines, openPanel);
}

/*
 * 點擊合成 craftingSystem（關卡 3、4）
 *   第 1 步 handleShelfPick：學生點層架的容器
 *      → judgeContainer() 判斷容器
 *      → 播放合成動畫卡片（對：綠光＋叮咚；錯：食物被遮住、紅框抖動）
 *      → 對：Grandma 滿意，面板出現單複數按鈕
 *        錯：Grandma 溫和的謎語提示、扣生命值、記錄錯題，回到選容器
 *   第 2 步 handleFormPick：學生選單複數（例：glass / glasss / glasses）
 *      → 交給原本的 judgeFill()，單複數錯就走原本的提示與追加題
 */
function handleShelfPick(word) {
  if (game.state !== STATES.ANSWER) return;
  const stage = D();
  if (stage.type !== 'craft') return;
  const field = stage.fields.find(f => !L().solved[f.id]);
  if (!field || L().picked[field.id]) return;        // 容器已選好，正在等單複數

  closePanel();
  ui.play([{ speaker: 'think', text: `用 ${word} 裝裝看……` }]);
  const res = judgeContainer(field, word);
  if (res.ok) sfx.correct();
  const round = game;
  ui.craftFx(res.ok ? 'right' : 'wrong', word, field.id, craftCaption(field, word),
    situationNote(field.id, word, res.ok)).then(() => {
    if (game !== round) return;
    if (res.ok) {
      L().picked[field.id] = word;
      ui.play([{ speaker: 'npc', state: 'happy', text: field.reactions.right }], openPanel);
      return;
    }
    giveHint({ ...res, scenes: [[{ speaker: res.type === 'textbookOnly' ? 'tutor' : 'npc', state: res.state, text: res.line, sub: res.sub }]] },
      `${stage.title}-${field.id}-shelf-${word}`, questionId(`${field.id}-container`));
  });
}

function handleFormPick(form) {
  if (game.state !== STATES.ANSWER) return;
  const stage = D();
  const field = stage.fields.find(f => !L().solved[f.id]);
  closePanel();
  const res = judgeFill(stage, field, form);
  if (res.ok) {
    L().solved[field.id] = true;
    if (stage.fields.every(f => L().solved[f.id])) { clearLevel(); return; }
    sfx.correct();
    ui.play([{ speaker: 'think', text: `${form}，數量也對了！下一個……` }], openPanel);
    return;
  }
  notePending(field, res);          // 漏 s → 通過這關後出追加題
  giveHint(res, `${stage.title}-${field.id}-${res.type}`, questionId(`${field.id}-plural`));
}

/*
 * Boss 戰盲打：每按一個字母呼叫一次
 *   打對 → 底線翻成金色字母、微震、揮擊聲；遇到空白自動跳過；整串打完 → finishAttack()
 *   打錯 → 「喀」聲、整串閃紅、大野狼往前一步；同一題第一次錯計入拼字錯誤
 *          Hard：這一招的倒數扣 2 秒，扣到 0 就失敗
 */
function battleKey(k) {
  if (game.state !== STATES.ANSWER || D().type !== 'battle' || !game.battle) return;
  const bt = game.battle;
  const en = bt.attacks[bt.idx].en;
  if (k === en[bt.pos]) {
    const hit = bt.pos;
    bt.pos++;
    while (en[bt.pos] === ' ') bt.pos++;     // 自動跳過空白
    sfx.hit(bt.combo++);                     // 連擊越多，叮聲越高
    ui.updateTyping(hit);
    if (bt.pos >= en.length) finishAttack();
    return;
  }
  sfx.thud();
  bt.combo = 0;                              // 打錯：連擊歸零
  ui.flashTypingError();
  bt.creep = Math.min(170, bt.creep + 12);   // 打錯：大野狼趁機往前一步
  if (!bt.missThis) { bt.missThis = true; recordError(`5-attack${bt.idx + 1}`, 'typo'); }
  const pen = DIFFICULTY[bt.diff].penalty;
  if (pen) {
    bt.timeLeft = Math.max(0, bt.timeLeft - pen);
    ui.timerPenalty(pen);
    ui.updateTimer();
    if (bt.timeLeft <= 0) { closePanel(); die('time'); }
  }
}

/*
 * 完成一擊：強烈震動 → 丟出食物 → 命中時 -999 CRITICAL!、大野狼扣血被打退
 *          → 大野狼吐槽（wolfReaction）→ 1.5 秒後自動換下一題；3 題都打完進結局
 */
function finishAttack() {
  const stage = D();
  const bt = game.battle;
  const atk = bt.attacks[bt.idx];
  closePanel();                    // 面板收起、倒數暫停
  sfx.critical();
  ui.quake();
  ui.typeLine({ speaker: 'red', text: `Take this! ${atk.en.charAt(0).toUpperCase() + atk.en.slice(1)}!`, sub: `【${atk.zh}】` });
  const hpLeft = bt.attacks.length - bt.idx - 1;
  const last = hpLeft === 0;
  const round = game;
  fx.attack(atk, () => {
    if (game !== round) return;
    bt.creep = 0;
    ui.setNpc(undefined, 'hurt');
    ui.hitNpc();
    ui.setHp(hpLeft);
  }).then(() => {
    if (game !== round) return;
    ui.typeLine({ speaker: 'npc', state: 'hurt', text: atk.wolfReaction });
    // 等吐槽打字完，再停 1.5 秒自動往下
    setTimeout(() => {
      if (game !== round) return;
      if (last) {
        $('game').classList.remove('danger', 'hell');
        ui.play(stage.done, () => { game.queue.shift(); showResult(); });
        return;
      }
      bt.idx++;
      bt.pos = 0;
      bt.missThis = false;
      bt.timeLeft = bt.limit;          // 每一招獨立計時：擊中後重置秒數
      ui.setNpc(undefined, 'wolf');
      openPanel();
    }, atk.wolfReaction.length * 32 + 1500);
  });
}

function handleFillSubmit() {
  const stage = D();
  if (stage.type !== 'fill') return;     // 關卡 3～5 改成點層架，不走打字送出
  // 送出前先記下輸入內容，答錯回來時保留讓他修改
  stage.fields.forEach(f => {
    if (!L().solved[f.id]) L().values[f.id] = $('in-' + f.id).value;
  });
  closePanel();

  let first = null;
  L().wrong = {};
  stage.fields.forEach(f => {
    if (L().solved[f.id]) return;
    const res = judgeFill(stage, f, L().values[f.id]);
    if (res.ok) { L().solved[f.id] = true; return; }
    L().wrong[f.id] = true;
    notePending(f, res);              // 每一格漏 s 都登記追加題
    if (!first) first = { res, f };   // 但提示一次只講一個問題，先講前面那格
  });

  if (first) { giveHint(first.res, `${stage.title}-${first.f.id}-${first.res.type}`, questionId(first.f.id)); return; }
  clearLevel();
}

// 回到主頁：重置所有狀態，回到開場畫面
function resetToTitle() {
  speech.stop();
  music.stop();
  ui.stopAll();
  errorRecords = {};
  redHp = RED_MAX_HP;
  deathCount = 0;
  game = freshGame();
  $('game').classList.remove('ending', 'quake');
  $('result-screen').classList.remove('show');
  $('title-screen').classList.add('show');
  ui.hidePanel();
  ui.setScene('home');
  ui.setNpc('mom', 'normal');
  ui.updateInfo();
}

/* =========================================================
 * 八、事件處理
 * ========================================================= */
$('start-btn').addEventListener('click', () => {
  speech.unlock();          // 必須在點擊事件裡初始化語音，否則瀏覽器會擋
  speech.enabled = speech.supported && soundOn;
  music.prime();            // 同理，先在點擊裡解鎖戰鬥音樂
  ui.updateMute();
  sfx.unlock();             // 正確音效的 AudioContext 也要在點擊裡建立
  $('title-screen').classList.remove('show');
  startGame();
});

$('home-btn').addEventListener('click', () => {
  if (game.state !== STATES.TITLE) resetToTitle();
});

// 音效總開關：語音與戰鬥音樂一起開關
$('mute-btn').addEventListener('click', () => {
  soundOn = !soundOn;
  speech.enabled = speech.supported && soundOn && game.state !== STATES.TITLE;
  if (!soundOn) speech.stop();
  music.setMuted(!soundOn);
  ui.updateMute();
});

$('dialogue').addEventListener('click', () => {
  if (game.state === STATES.STORY) ui.advance();
});

$('panel').addEventListener('click', e => {
  if (game.state !== STATES.ANSWER) return;
  const btn = e.target.closest('[data-choice]');
  if (btn) handleChoice(btn.dataset.choice);
  if (e.target.id === 'submit-btn') handleFillSubmit();
  const formBtn = e.target.closest('[data-form]');
  if (formBtn) handleFormPick(formBtn.dataset.form);
  const vk = e.target.closest('[data-key]');          // 觸控裝置的字母按鈕
  if (vk) battleKey(vk.dataset.key);
  const diffBtn = e.target.closest('[data-diff]');    // Boss 戰難度選擇
  if (diffBtn) chooseDifficulty(diffBtn.dataset.diff);
});

// 點廚房層架上的物品 → 點擊合成（關卡 3、4）或 Boss 戰出招（關卡 5）
$('kitchen-shelf').addEventListener('click', e => {
  const item = e.target.closest('[data-item]');
  if (item && $('kitchen-shelf').classList.contains('active')) handleShelfPick(item.dataset.item);
});

$('retry-btn').addEventListener('click', retryAfterDeath);
$('giveup-btn').addEventListener('click', giveUpAfterDeath);

$('result-screen').addEventListener('click', e => {
  if (e.target.id === 'unlock-btn') $('minigame').classList.toggle('show');
  if (e.target.id === 'again-btn') resetToTitle();
});

document.addEventListener('keydown', e => {
  const inInput = e.target.tagName === 'INPUT';
  // Boss 戰盲打：全局捕捉字母鍵（不需要任何輸入框）
  if (game.state === STATES.ANSWER && D().type === 'battle' && game.battle) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.isComposing || e.key === 'Process') {      // 中文輸入法開著，按鍵抓不到字母
      const note = $('type-note');
      if (note) note.textContent = '⚠ 請先切換成英文輸入法（按 Shift 或 Ctrl＋空白鍵）';
      return;
    }
    if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); battleKey(e.key.toLowerCase()); }
    else if (e.key === ' ') e.preventDefault();      // 不用按空白，也別讓頁面捲動
    return;
  }
  if (inInput && e.key === 'Enter' && game.state === STATES.ANSWER) {
    handleFillSubmit();
    return;
  }
  if (!inInput && (e.key === 'Enter' || e.key === ' ') && game.state === STATES.STORY) {
    e.preventDefault();
    ui.advance();
  }
});

// 預載所有素材
['bg_home', 'bg_room', 'bg_kitchen', 'bg_end', 'sp_red', 'sp_mom', 'sp_granny_normal',
  'sp_granny_happy', 'sp_granny_angry', 'sp_wolf', 'sp_wolf_hurt']
  .forEach(n => { new Image().src = `assets/${n}.webp`; });

ui.updateMute();
ui.updateInfo();
</script>
