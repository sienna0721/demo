<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小紅帽的森林外送任務｜英文量詞 Quantifiers</title>
<style>
  /* ====== 主題色與可替換素材（換圖只要改這裡） ====== */
  :root {
    --ink: #2b1d2f;
    --red: #c8323c;
    --red-dark: #8f1f28;
    --forest: #2f5d50;
    --forest-dark: #1d3d34;
    --gold: #e9b949;
    --ok: #2e8b57;
    --bad: #c8323c;

    /* 背景：之後換成 url('bg_home.png') center / cover 之類即可 */
    --bg-home: url('assets/bg_home.webp') center / cover no-repeat, #8fb8d8;
    --bg-room: url('assets/bg_room.webp') center / cover no-repeat, #b88bc9;
    --bg-kitchen: url('assets/bg_kitchen.webp') center / cover no-repeat, #f3cf98;
    --bg-battle: linear-gradient(rgba(110, 10, 30, 0.5), rgba(40, 0, 15, 0.7)), url('assets/bg_kitchen.webp') center / cover no-repeat, #3a1020;
    --bg-end: url('assets/bg_end.webp') center / cover no-repeat, #4f8a73;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #1c1420;
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  #game {
    position: relative;
    width: min(100vw, 960px);
    height: min(100dvh, 720px);
    background: #000;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    user-select: none;
  }

  /* ====== 主視覺區 Stage ====== */
  #stage {
    position: absolute;
    inset: 0;
    background: var(--bg-home);
    transition: background 0.8s ease;
  }
  #stage.scene-home { background: var(--bg-home); }
  #stage.scene-room { background: var(--bg-room); }
  #stage.scene-kitchen { background: var(--bg-kitchen); }
  #stage.scene-battle { background: var(--bg-battle); }
  #stage.scene-end { background: var(--bg-end); }

  /* Boss 戰畫面劇烈震動 */
  #game.quake #stage,
  #game.quake #panel { animation: quake 0.5s ease 2; }
  @keyframes quake {
    0%, 100% { translate: 0 0; }
    15% { translate: -14px 6px; }
    30% { translate: 12px -8px; }
    45% { translate: -10px -4px; }
    60% { translate: 10px 8px; }
    75% { translate: -6px 4px; }
    90% { translate: 4px -2px; }
  }

  /* ====== 上方常駐控制列 ====== */
  #topbar {
    position: absolute;
    top: 12px;
    left: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 12;               /* 比開場、結算畫面還高，「回到主頁」隨時按得到 */
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  #topbar .spacer { flex: 1; }
  .top-tag {
    background: rgba(0, 0, 0, 0.4);
    color: #fff;
    font-size: 13px;
    padding: 5px 10px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .top-btn { font: inherit; font-size: 13px; border: 0; cursor: pointer; }
  .top-btn:hover { background: rgba(0, 0, 0, 0.6); }
  #home-btn { background: rgba(200, 50, 60, 0.85); }
  #home-btn:hover { background: var(--red); }

  /* ====== 角色立繪 Sprites（assets/ 裡的去背圖，換圖只要換檔案） ====== */
  .sprite {
    position: absolute;
    bottom: 16%;                 /* 腳稍微藏在對話框後面，視覺小說常見的站位 */
    transition: transform 0.35s ease, filter 0.35s ease;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: bottom center;
  }
  /* 文字標籤只留給螢幕閱讀器，畫面上不顯示 */
  .sprite-label {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }

  /* 右側 NPC：同一個 div 依 char-* 切換角色、state-* 切換表情 */
  #npc { right: 8%; width: 290px; height: 470px; }
  #npc.char-mom                  { background-image: url('assets/sp_mom.webp'); }
  #npc.char-grandma.state-normal { background-image: url('assets/sp_granny_normal.webp'); }
  #npc.char-grandma.state-hint   { background-image: url('assets/sp_granny_normal.webp'); transform: translateY(-8px) rotate(-2deg); }
  #npc.char-grandma.state-happy  { background-image: url('assets/sp_granny_happy.webp'); transform: translateY(-14px); }
  #npc.char-grandma.state-angry  { background-image: url('assets/sp_granny_angry.webp'); animation: shake 0.4s; }
  #npc.char-grandma.state-wolf   { background-image: url('assets/sp_wolf.webp'); transform: scale(1.05); transform-origin: bottom center; }
  #npc.char-grandma.state-hurt   { background-image: url('assets/sp_wolf_hurt.webp'); transform: translateX(30px) rotate(8deg); transform-origin: bottom center; }
  /* 結局：大野狼逃走，往右淡出 */
  #npc.char-grandma.state-gone   { background-image: url('assets/sp_wolf_hurt.webp'); transform: translateX(260px) rotate(15deg); opacity: 0; transition: transform 1s ease-in, opacity 1s ease-in; }

  #red { left: 9%; width: 220px; height: 345px; background-image: url('assets/sp_red.webp'); }

  /* Boss 戰：大野狼逼近（style.translate）要有過場 */
  #npc { transition: transform 0.35s ease, filter 0.35s ease, background 0.35s ease, translate 0.4s ease; }
  /* 命中：閃白、變紅、被往後打退 */
  #npc.hit { animation: hit 0.7s ease; }
  @keyframes hit {
    0%   { filter: brightness(3); }
    25%  { filter: brightness(1.2) sepia(1) saturate(6) hue-rotate(-30deg); translate: 70px -10px; }
    100% { filter: none; translate: 0 0; }
  }

  /* Boss 戰：大野狼血條（在 NPC 頭頂上方） */
  #boss-hp {
    position: absolute;
    right: 8%;
    width: 290px;
    bottom: calc(16% + 478px);
    display: none;
    align-items: center;
    gap: 6px;
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    text-shadow: 0 1px 2px #000;
  }
  #boss-hp.show { display: flex; }
  #boss-hp .seg {
    flex: 1;
    height: 14px;
    background: #e23b3b;
    border: 2px solid #fff;
    border-radius: 4px;
    transition: background 0.3s, opacity 0.3s;
  }
  #boss-hp .seg.lost { background: #333; opacity: 0.5; }
  #game.ending #boss-hp { display: none; }

  /* Boss 戰：小紅帽愛心條（在 Red 頭頂上方） */
  #red-hearts {
    position: absolute;
    left: 9%;
    width: 220px;
    bottom: calc(16% + 352px);
    display: none;
    justify-content: center;
    gap: 4px;
    font-size: 26px;
    line-height: 1;
    filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.6));
  }
  #red-hearts.show { display: flex; }
  #red-hearts .heart { color: #ff3b5c; transition: transform 0.3s, color 0.3s; }
  #red-hearts .heart.lost { color: rgba(60, 60, 60, 0.7); transform: scale(0.8); }
  /* 愛心扣光：最後一次機會，閃爍警告 */
  #red-hearts.last { animation: last-chance 0.6s ease-in-out infinite alternate; }
  #red-hearts.last::after { content: '最後機會！'; font-size: 14px; font-weight: 800; color: #fff; align-self: center; margin-left: 6px; }
  @keyframes last-chance { from { opacity: 1; } to { opacity: 0.45; } }
  #game.ending #red-hearts { display: none; }

  /* ====== 互動式廚房層架（關卡 3～5 才出現） ====== */
  #kitchen-shelf {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    width: min(94%, 780px);
    display: none;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 8px 10px 14px;
    background: linear-gradient(180deg, #c48d55, #9a6537);
    border-bottom: 8px solid #6e4626;          /* 木頭層板 */
    border-radius: 12px 12px 4px 4px;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
    z-index: 6;
  }
  #kitchen-shelf.show { display: flex; }
  .shelf-item {
    font: inherit;
    width: 86px;
    height: 86px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: rgba(255, 252, 244, 0.92);
    border: 3px solid #f3d9a8;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s;
  }
  .shelf-item .svg-icon { display: block; transition: transform 0.2s ease; filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.12)); }
  /* hover：整顆按鈕放大之外，圖示再輕輕晃一下 */
  #kitchen-shelf.active .shelf-item:hover .svg-icon { animation: icon-wiggle 0.5s ease; }
  @keyframes icon-wiggle { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-8deg); } 65% { transform: rotate(6deg); } }
  .shelf-item .word { font-size: 13px; font-weight: 800; color: #5a3a1e; font-family: "Segoe UI", sans-serif; }
  /* 可以點的時候才有 hover 放大；不能點時變淡 */
  #kitchen-shelf.active .shelf-item:hover { transform: scale(1.14) translateY(-4px); box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3); border-color: var(--gold); }
  #kitchen-shelf:not(.active) .shelf-item { opacity: 0.55; cursor: default; }
  /* 層架出現時，作答面板往下讓位 */
  #game.shelf-on #panel { top: 158px; }
  #game.shelf-on #boss-hp { bottom: auto; top: 168px; }
  .fav-short { display: none; }
  #game.ending #kitchen-shelf { display: none; }

  /* 面板裡：等待點層架的空格、單複數按鈕 */
  .pick-blank { display: inline-block; min-width: 110px; border-bottom: 3px solid var(--ink); text-align: center; font-weight: 700; color: var(--forest); }
  .pick-blank.active { background: #fff3d1; outline: 2px dashed var(--gold); border-radius: 4px; color: #a0475a; }
  .pick-blank.done { color: var(--ok); }
  .form-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .form-btn { font-family: "Segoe UI", sans-serif; }
  .pick-note { font-size: 14px; color: #7a6a7d; text-align: center; margin-top: 6px; }

  /* ====== 合成動畫卡片（點容器後彈出） ====== */
  #craft-fx {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 8;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  #craft-fx.show { opacity: 1; }
  .craft-card {
    position: relative;
    min-width: 260px;
    padding: 18px 30px 16px;
    background: rgba(255, 255, 255, 0.96);
    border: 5px solid #ccc;
    border-radius: 22px;
    text-align: center;
    transform: scale(0.6);
    transition: transform 0.35s cubic-bezier(.3, 1.6, .5, 1);
  }
  #craft-fx.show .craft-card { transform: scale(1); }
  .craft-icons { position: relative; height: 124px; display: flex; justify-content: center; align-items: flex-end; }
  .craft-container .svg-icon { display: block; }
  .craft-food { position: absolute; left: 50%; top: 0; transform: translateX(-50%); font-size: 46px; line-height: 1; transition: filter 0.3s; }
  .craft-caption { margin-top: 6px; font: 800 24px "Segoe UI", sans-serif; }
  .craft-sub { font-size: 15px; margin-top: 2px; }
  /* 錯誤：食物被遮住、紅框抖動 */
  #craft-fx.wrong .craft-card { border-color: var(--bad); animation: shake 0.4s 0.3s; }
  #craft-fx.wrong .craft-food { filter: brightness(0.15) blur(2px); opacity: 0.55; }
  #craft-fx.wrong .craft-caption { color: var(--bad); }
  /* 正確：綠光閃爍＋星星 */
  #craft-fx.right .craft-card { border-color: #4caf7a; animation: craft-glow 0.6s ease-in-out 3 alternate; }
  #craft-fx.right .craft-food { filter: drop-shadow(0 0 10px #ff9ad5) drop-shadow(0 0 16px #9ad5ff); }
  #craft-fx.right .craft-caption { color: var(--ok); }
  #craft-fx.right .craft-card::before,
  #craft-fx.right .craft-card::after { content: '✨'; position: absolute; font-size: 34px; animation: twinkle 0.7s ease-in-out infinite alternate; }
  #craft-fx.right .craft-card::before { left: -16px; top: -14px; }
  #craft-fx.right .craft-card::after { right: -16px; bottom: -10px; animation-delay: 0.35s; }
  @keyframes craft-glow { from { box-shadow: 0 0 0 0 rgba(76, 175, 122, 0.7); } to { box-shadow: 0 0 0 16px rgba(76, 175, 122, 0); } }
  @keyframes twinkle { from { transform: scale(0.7); opacity: 0.6; } to { transform: scale(1.2); opacity: 1; } }
  #craft-fx.right .situation { filter: drop-shadow(0 0 8px rgba(76, 175, 122, 0.75)); }
  /* ====== 情境組合圖 Situation Renderer ====== */
  .situation { position: relative; width: 120px; height: 120px; margin: 0 auto; }
  .situation .sl { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  /* 灑出來：先像水柱落下，再壓扁成一攤 */
  .sit-spill .puddle { transform-origin: 50% 92%; transform: scale(1.45, 0.2); animation: sit-spill 0.9s ease-out; }
  @keyframes sit-spill { from { transform: translateY(-40%) scale(0.3, 1); } }
  .sit-spill .drops { animation: sit-drops 0.9s ease-out; }
  @keyframes sit-drops { from { opacity: 0; translate: 0 -25%; } }
  /* 硬塞進去：歪斜卡住、抖幾下 */
  .situation .wob { transform-origin: 50% 60%; animation: sit-wobble 0.3s ease-in-out 5 alternate; }
  @keyframes sit-wobble { from { rotate: -6deg; } }
  /* 倒進去、放上去 */
  .situation .food-layer { animation: sit-pour 0.7s ease-out; }
  @keyframes sit-pour { from { opacity: 0; } }
  .situation .slide { animation: sit-slide 0.6s ease-out; }
  @keyframes sit-slide { from { translate: 0 -30%; opacity: 0; } }
  .situation .steam { animation: sit-steam 1.1s ease-in-out infinite alternate; }
  @keyframes sit-steam { from { translate: 0 5%; opacity: 0.35; } }
  /* 看不到漸層：角落冒問號 */
  .sit-badge { position: absolute; right: -4px; top: -2px; width: 30px; height: 30px; border-radius: 50%;
               background: #fff; border: 3px solid #c8323c; color: #c8323c; font: 900 18px/24px sans-serif;
               text-align: center; animation: sit-badge 0.5s 0.4s both cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes sit-badge { from { transform: scale(0); } }
  /* ====== 情境組合圖 end ====== */


  @media (max-width: 600px) {
    .shelf-item { width: 58px; height: 58px; }
    .shelf-item .svg-icon { width: 34px; height: 34px; }
    .shelf-item .word { font-size: 11px; }
    #game.shelf-on #panel { top: 196px; }
    #game.shelf-on #boss-hp { top: 228px; }
    #game.shelf-on #panel { top: 226px; }
    .fav-long { display: none; }
    .btn-long { display: none; }
    .fav-short { display: inline; }
  }
  #game:has(#panel:not(.hidden)) #red-hearts { visibility: hidden; }

  /* 失敗：小紅帽倒下 */
  #red.down { transform: rotate(-16deg) translateY(30px) scale(0.95); filter: grayscale(1) brightness(0.6); transition: transform 0.6s ease-in, filter 0.6s; transform-origin: bottom left; }
  /* 失敗：大野狼衝到小紅帽面前（位移量由程式算） */
  #npc.lunge { transition: translate 0.45s cubic-bezier(.5,0,.9,.5); }

  /* 倒數計時條（Boss 戰面板） */
  .timer { display: flex; align-items: center; gap: 8px; margin: 2px 0 6px; font-size: 14px; font-weight: 800; color: var(--forest); }
  .timer-bar { flex: 1; height: 10px; background: #e6e0e8; border-radius: 6px; overflow: hidden; }
  .timer-fill { height: 100%; background: #4caf7a; border-radius: 6px; transition: width 0.1s linear, background 0.3s; }
  .timer.warn { color: var(--red); }
  .timer.warn .timer-fill { background: var(--red); }
  .timer.warn .timer-num { animation: last-chance 0.4s ease-in-out infinite alternate; }
  .battle-head .mini-red { font-size: 13px; font-weight: 700; color: #c2185b; white-space: nowrap; }

  /* ====== Boss 戰難度選擇 ====== */
  .diff-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0 4px; }
  .diff-btn { font: inherit; border: 0; border-radius: 12px; padding: 14px 8px; color: #fff; cursor: pointer;
              display: flex; flex-direction: column; gap: 6px; align-items: center; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
              transition: transform 0.12s; }
  .diff-btn:hover { transform: translateY(-3px) scale(1.03); }
  .diff-btn b { font-size: 20px; }
  .diff-btn span { font-size: 13px; opacity: 0.92; line-height: 1.4; }
  .diff-btn.diff-easy { background: #3f9b6b; } .diff-btn.diff-normal { background: #d9822b; } .diff-btn.diff-hard { background: #b3242e; }
  .diff-tag.diff-easy { background: #3f9b6b; }
  .hint-char { color: #a99aae; }

  /* ====== 死亡畫面按鈕 ====== */
  .died-count { margin-top: 4px; color: #b98c8c; font-size: 14px; letter-spacing: 2px; }
  .died-actions { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .died-giveup { font: inherit; background: none; border: 0; color: #c9a7a7; text-decoration: underline; cursor: pointer; font-size: 14px; }

  /* ====== VHS 倒轉回歸 ====== */
  #rewind-overlay { position: absolute; inset: 0; z-index: 11; display: none; overflow: hidden; }
  #rewind-overlay.show { display: block; }
  #game.rewinding #stage, #game.rewinding #dialogue { filter: sepia(0.5) hue-rotate(-30deg) invert(80%); }
  #game.rewinding #stage { animation: vhs-jitter 0.18s steps(2) infinite; }
  .rw-noise { position: absolute; inset: 0; opacity: 0.35; mix-blend-mode: screen;
              background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.18) 0 1px, transparent 1px 3px),
                          repeating-linear-gradient(90deg, rgba(255, 0, 0, 0.06) 0 2px, rgba(0, 255, 255, 0.06) 2px 4px);
              animation: vhs-noise 0.12s steps(3) infinite; }
  .rw-bar { position: absolute; left: 0; right: 0; height: 26px; background: rgba(255, 255, 255, 0.28); filter: blur(2px);
            animation: vhs-bar 0.9s linear infinite; }
  .rw-label { position: absolute; top: 60px; left: 22px; color: #ff2d3c; font: 900 30px/1 "Courier New", monospace;
              letter-spacing: 3px; text-shadow: 2px 0 #00e5ff, -2px 0 #ff00aa; animation: rw-blink 0.5s steps(2) infinite; }
  .rw-time { position: absolute; top: 64px; right: 26px; color: #fff; font: 700 20px/1 "Courier New", monospace; text-shadow: 2px 0 #ff00aa; }
  #rewind-frame { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(1.4); }
  #rewind-frame .situation { filter: drop-shadow(3px 0 #ff00aa) drop-shadow(-3px 0 #00e5ff); }
  @keyframes vhs-jitter { 50% { translate: -6px 2px; } }
  @keyframes vhs-noise { 33% { background-position: 0 2px, 3px 0; } 66% { background-position: 0 -2px, -3px 0; } }
  @keyframes vhs-bar { from { top: -30px; } to { top: 100%; } }
  @keyframes rw-blink { 50% { opacity: 0.25; } }

  /* ====== Boss 戰盲打 ====== */
  .diff-tag { font-size: 12px; font-weight: 800; color: #fff; border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
  .diff-normal { background: #3f7d5b; } .diff-hard { background: #d9822b; } .diff-hell { background: #8f1f28; }
  .atk-zh { text-align: center; font-size: 34px; font-weight: 900; color: var(--red-dark); letter-spacing: 2px; margin: 2px 0; }
  #type-line { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 4px; margin: 6px 0 4px;
               font: 800 30px/1 Consolas, "Courier New", monospace; }
  .tc { display: inline-block; width: 24px; height: 38px; line-height: 38px; text-align: center; border-bottom: 4px solid #6b5a70; }
  .tc.gap { width: 26px; border: 0; }
  .untyped-char { color: transparent; }
  .typed-char { color: #c8901a; border-color: var(--gold); text-shadow: 0 0 8px rgba(255, 200, 60, 0.9); }
  .tc.cursor { border-color: var(--red); animation: cursor-blink 0.8s steps(2) infinite; }
  @keyframes cursor-blink { 50% { border-color: transparent; } }
  .tc.pop { animation: char-hit 0.15s ease-out; }
  @keyframes char-hit { from { transform: translateX(2px) scale(1.25); } }
  #type-line.miss .tc { animation: type-miss 0.35s ease; }
  @keyframes type-miss { 0%, 100% { background: transparent; } 30%, 70% { background: rgba(200, 50, 60, 0.35); border-color: var(--red); } }
  #type-line.miss { animation: shake 0.3s; }
  .timer { position: relative; }
  .timer-pen { position: absolute; right: 54px; top: -6px; color: var(--red); font-weight: 900; font-size: 18px; animation: pen-up 0.9s ease-out forwards; }
  @keyframes pen-up { to { transform: translateY(-14px); opacity: 0; } }
  /* 觸控裝置的字母鍵 */
  .vkb { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .vkb-row { display: flex; gap: 4px; }
  .vk { font: 700 16px "Segoe UI", sans-serif; width: 30px; height: 36px; border: 0; border-radius: 6px; background: #f1e6ea; color: var(--ink); }
  .vk:active { background: var(--gold); }
  /* 紅色警戒濾鏡 */
  .danger-filter { position: absolute; inset: 0; z-index: 3; pointer-events: none; display: none;
                   background: radial-gradient(ellipse at center, transparent 45%, rgba(200, 0, 0, 0.35) 100%);
                   animation: danger-pulse 1.2s ease-in-out infinite alternate; }
  #game.danger .danger-filter { display: block; }
  #game.hell .danger-filter { background: radial-gradient(ellipse at center, rgba(120, 0, 0, 0.12) 30%, rgba(200, 0, 0, 0.55) 100%); animation-duration: 0.7s; }
  @keyframes danger-pulse { from { opacity: 0.55; } to { opacity: 1; } }
  #game.ending .danger-filter { display: none; }
  /* 丟出去的食物、命中噴濺、爆擊數字 */
  .fx-icon { width: 74px; height: 74px; }
  .fx-icon .situation { width: 74px; height: 74px; }
  .fx-icon > svg { width: 100%; height: 100%; }
  .fx-dot { width: 12px; height: 12px; border-radius: 50%; }
  .fx-dmg { font: 900 54px/1 "Segoe UI", sans-serif; color: #ff2d3c; white-space: nowrap; text-align: center;
            -webkit-text-stroke: 2px #fff; text-shadow: 0 4px 0 #8f1f28, 0 0 18px rgba(255, 60, 60, 0.8); }
  .fx-dmg small { display: block; font-size: 24px; letter-spacing: 3px; margin-top: 2px; }
  @media (max-width: 600px) {
    .atk-zh { font-size: 26px; }
    .diff-pick { grid-template-columns: 1fr; }
    .diff-btn { padding: 10px 8px; }
    .rw-label { font-size: 22px; }
    #type-line { font-size: 22px; gap: 4px 3px; }
    .tc { width: 13px; height: 26px; line-height: 26px; border-bottom-width: 3px; }
    .tc.gap { width: 12px; }
    #type-line { font-size: 17px; gap: 3px 2px; flex-wrap: nowrap; }
    .battle-head { flex-wrap: wrap; row-gap: 2px; }
    .battle-head .panel-title { width: 100%; }
    #type-note { font-size: 12px; }
    .vk { width: 30px; height: 30px; font-size: 15px; }
    #panel.battle { padding: 10px 12px 12px; }
    .fx-dmg { font-size: 40px; }
  }

  /* YOU DIED 畫面 */
  #you-died {
    position: absolute;
    inset: 0;
    z-index: 9;
    display: none;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(40, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.88) 75%);
    animation: died-fade 1.2s ease forwards;
  }
  #you-died.show { display: flex; }
  .died-band {
    width: 100%;
    padding: 34px 0 26px;
    text-align: center;
    background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.85) 20%, rgba(0, 0, 0, 0.85) 80%, transparent);
  }
  .died-title {
    font-family: "Times New Roman", "Noto Serif TC", serif;
    font-size: clamp(48px, 11vw, 96px);
    letter-spacing: 0.12em;
    color: #b3121b;
    text-shadow: 0 0 18px rgba(179, 18, 27, 0.6);
    animation: died-zoom 2.4s ease-out forwards;
  }
  .died-sub { margin-top: 10px; color: #e8c9c9; font-size: 18px; letter-spacing: 2px; }
  @keyframes died-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes died-zoom { from { transform: scale(1.25); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* 推薦影片下方的備用連結 */
  .video-link { display: inline-block; margin: -4px 0 14px; font-size: 14px; color: var(--forest); font-weight: 700; }
  /* 作答面板打開時面板裡有迷你血條，頭頂這條先藏起來，免得從面板邊緣露出一角 */
  #game:has(#panel:not(.hidden)) #boss-hp { visibility: hidden; }

  /* ====== Boss 戰動作特效（道具目前是 CSS 色塊，可換成圖片） ====== */
  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .fx { position: absolute; transform: translate(-50%, -50%); }
  .fx-bag {
    width: 50px;
    height: 60px;
    background: #efe3c6;
    border: 3px solid #a98d5c;
    border-radius: 8px 8px 14px 14px;
    color: #7a5c2a;
    font: 800 10px/60px sans-serif;
    text-align: center;
  }
  .fx-puff {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.97) 0%, rgba(246, 240, 228, 0.85) 42%, rgba(255, 255, 255, 0) 70%);
  }
  .fx-shaker {
    width: 26px;
    height: 40px;
    background: #fff;
    border: 2px solid #9a9a9a;
    border-top: 9px solid #b9b9b9;
    border-radius: 6px 6px 4px 4px;
  }
  .fx-grain { width: 6px; height: 6px; background: #fff; border-radius: 1px; box-shadow: 0 0 5px rgba(255, 255, 255, 0.95); }
  .fx-plate {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0 44%, #dbe8ee 45% 58%, #fff 59%);
    border: 5px solid #6fa7c2;
  }
  .fx-shard { width: 16px; height: 10px; background: #fff; border: 2px solid #6fa7c2; clip-path: polygon(0 0, 100% 30%, 60% 100%); }
  .fx-flash {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, rgba(255, 228, 120, 0.9) 30%, rgba(255, 120, 60, 0) 70%);
  }
  .fx-word {
    font-size: 44px;
    font-weight: 900;
    color: #fff;
    white-space: nowrap;
    -webkit-text-stroke: 2px var(--red-dark);
    text-shadow: 0 4px 0 var(--red-dark);
  }

  /* Boss 戰面板標頭：第幾招與迷你血條 */
  .battle-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .battle-head .panel-title { margin: 0; }
  .mini-hp { font-size: 13px; font-weight: 700; color: var(--red-dark); white-space: nowrap; }
  .mini-seg { display: inline-block; width: 22px; height: 10px; margin-left: 3px; background: #e23b3b; border-radius: 3px; vertical-align: middle; }
  .mini-seg.lost { background: #ccc; }

  .sprite.dim { filter: brightness(0.6) saturate(0.7); }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  /* ====== 互動面板 Interactive Panel ======
     作答送出後立刻 display:none，下一個作答節點才再出現 */
  #panel {
    position: absolute;
    left: 50%;
    top: 54px;
    transform: translateX(-50%);
    width: min(92%, 680px);
    background: rgba(255, 255, 255, 0.97);
    border: 3px solid var(--forest);
    border-radius: 14px;
    padding: 16px 20px 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    z-index: 5;
    animation: panel-in 0.3s ease;
  }
  #panel.hidden { display: none; }
  #panel.battle { border-color: var(--red); box-shadow: 0 0 0 4px rgba(200, 50, 60, 0.35), 0 10px 30px rgba(0, 0, 0, 0.5); }
  #panel.battle .panel-title { color: var(--red); }
  @keyframes panel-in {
    from { opacity: 0; transform: translate(-50%, -16px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }

  .panel-title { font-size: 14px; color: var(--forest); font-weight: 700; margin-bottom: 8px; }
  .who { font-size: 14px; color: #7a6a7d; margin-bottom: 2px; }

  .q-line {
    font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    font-size: 21px;
    line-height: 2.1;
    margin: 2px 0;
    padding: 2px 10px;
    border-radius: 8px;
  }
  .q-line.active { background: #fff3d1; outline: 2px dashed var(--gold); }
  .q-line.done { color: var(--ok); }

  .blank {
    display: inline-block;
    min-width: 120px;
    border-bottom: 3px solid var(--ink);
    text-align: center;
    font-weight: 700;
    color: var(--forest);
  }

  .slot { display: inline-flex; flex-direction: column; align-items: center; vertical-align: bottom; line-height: 1.2; }
  .letters { font-size: 14px; color: var(--red); letter-spacing: 2px; font-weight: 700; }
  .word-input {
    font: inherit;
    font-size: 20px;
    width: 124px;
    padding: 2px 8px;
    border: none;
    border-bottom: 3px solid var(--ink);
    background: #fffbea;
    text-align: center;
    color: var(--ink);
    outline: none;
    border-radius: 4px 4px 0 0;
  }
  .word-input:focus { background: #fff0b3; }
  .word-input.ok { border-color: var(--ok); color: var(--ok); background: #e6f6ec; }
  .word-input.bad { border-color: var(--bad); }
  .zh-tag { font-size: 15px; color: #7a6a7d; }

  .choice-row { display: flex; gap: 14px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }

  .btn {
    font: inherit;
    font-size: 20px;
    font-weight: 700;
    padding: 12px 26px;
    border-radius: 10px;
    border: 3px solid var(--red-dark);
    background: var(--red);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--red-dark);
    transition: transform 0.1s, box-shadow 0.1s, background 0.2s;
  }
  .btn:hover { background: #d9434d; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-dark); }
  .btn.alt { background: var(--forest); border-color: var(--forest-dark); box-shadow: 0 4px 0 var(--forest-dark); }
  .btn.alt:hover { background: #3b7364; }
  .btn.attack { font-size: 24px; padding: 12px 40px; letter-spacing: 1px; }

  /* ====== 對話框 Dialogue Box ====== */
  #dialogue {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    min-height: 25%;
    background: rgba(28, 18, 34, 0.9);
    border: 3px solid var(--gold);
    border-radius: 14px;
    padding: 30px 26px 22px;
    color: #fff;
    cursor: pointer;
    z-index: 4;
  }
  #speaker {
    position: absolute;
    top: -20px;
    left: 22px;
    padding: 4px 18px;
    background: var(--red);
    border: 3px solid var(--gold);
    border-radius: 8px;
    font-weight: 700;
    font-size: 17px;
  }
  #speaker.npc { background: #55606e; }
  #speaker.mom { background: #3f7d5b; }
  #speaker.tutor { background: #2f6fa8; }
  #speaker.narr { background: #4a3d52; }
  #speaker.think { background: #a0475a; }   /* Red 的內心戲 */

  #text { font-size: 21px; line-height: 1.65; min-height: 2em; white-space: pre-wrap; }
  #sub { margin-top: 6px; font-size: 16px; color: #f1d9a0; min-height: 1.2em; }
  /* 課本單字粗體 */
  #text strong { color: #ffd76a; font-weight: 800; }
  #sub strong { color: #fff; }

  #next-arrow {
    position: absolute;
    right: 20px;
    bottom: 12px;
    color: var(--gold);
    font-size: 18px;
    opacity: 0;
    animation: bob 0.9s infinite;
  }
  #next-arrow.show { opacity: 1; }

  /* 對話框教學圖解（約 120px） */
  #dialogue-icon {
    position: absolute;
    right: 40px;
    top: calc(50% - 8px);
    display: none;
    flex-direction: column;
    align-items: center;
    transform: translateY(-50%);
  }
  #dialogue.has-icon #dialogue-icon { display: flex; animation: icon-pop 0.45s cubic-bezier(.3, 1.6, .5, 1); }
  #dialogue.has-icon #text, #dialogue.has-icon #sub { padding-right: 150px; }
  .di-label { margin-top: 2px; font-size: 14px; font-weight: 800; color: var(--gold); white-space: nowrap; }
  @keyframes icon-pop { from { transform: translateY(-50%) scale(0.3); opacity: 0; } to { transform: translateY(-50%) scale(1); opacity: 1; } }
  @media (max-width: 600px) {
    #dialogue-icon .svg-icon { width: 72px; height: 72px; }
    #dialogue.has-icon #text, #dialogue.has-icon #sub { padding-right: 88px; }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(5px); }
  }

  /* 結算時隱藏對話框、立繪與面板 */
  #game.ending #dialogue,
  #game.ending .sprite,
  #game.ending #panel { display: none; }

  /* ====== 開場與結算畫面 ====== */
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
    padding: 56px 24px 24px;
    overflow-y: auto;
  }
  .overlay.show { display: flex; }

  #title-screen {
    background: radial-gradient(circle at 50% 35%, #a33a44 0%, #5a1d2a 60%, #2a0f18 100%);
    color: #fff;
  }
  #title-screen h1 { font-size: clamp(30px, 6vw, 52px); letter-spacing: 3px; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); }
  #title-screen .en { margin: 8px 0 26px; color: var(--gold); font-size: 18px; letter-spacing: 2px; }
  #title-screen p.desc { max-width: 520px; line-height: 1.8; margin-bottom: 28px; color: #f5dfe2; }
  #title-screen .note { margin-top: 14px; font-size: 13px; color: #d9b6bb; }

  #result-screen { background: rgba(20, 30, 26, 0.55); color: #fff; justify-content: flex-start; }
  .result-card {
    width: min(100%, 640px);
    background: #fff;
    color: var(--ink);
    border-radius: 16px;
    border: 4px solid var(--gold);
    padding: 22px 24px 24px;
    margin: auto 0;
  }
  .result-card h2 { color: var(--red); font-size: 28px; margin-bottom: 6px; }
  .badge {
    display: inline-block;
    margin: 10px 0;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.4;
  }
  .badge small { display: block; font-size: 14px; font-weight: 600; opacity: 0.8; }
  .badge.legend { background: linear-gradient(135deg, #f7d774, #e9a93a); }
  .badge.agent  { background: #f3d36b; }
  .badge.novice { background: #e6c3a0; }
  .weak { font-size: 14px; font-weight: 700; color: var(--red); margin-bottom: 4px; }
  .stats-title { font-size: 15px; margin-top: 8px; color: #555; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0 14px; }
  .stats .stat-row { position: relative; background: #f3eef5; border-radius: 8px; padding: 8px 4px; font-size: 13px; }
  .stats b { display: block; font-size: 19px; color: var(--forest); }
  /* 0 錯的類別：閃爍的 PERFECT 標籤 */
  .stats .perfect {
    display: inline-block; margin-top: 2px; font-size: 12px; font-weight: 800; color: #c98a00;
    animation: perfect-blink 0.9s ease-in-out infinite alternate;
  }
  @keyframes perfect-blink {
    from { opacity: 0.35; transform: scale(0.92); text-shadow: none; }
    to { opacity: 1; transform: scale(1.08); text-shadow: 0 0 8px #ffd34d; }
  }
  .review {
    text-align: left;
    background: #eef6f2;
    border: 1px solid #b9d6c8;
    padding: 10px 14px;
    border-radius: 8px;
    line-height: 1.8;
    font-size: 15px;
    margin-bottom: 14px;
  }
  .advice { font-size: 18px; font-weight: 700; color: var(--red-dark); margin: 4px 0 10px; }
  .rec-title { font-size: 16px; color: var(--forest); text-align: left; margin-bottom: 8px; }
  .rec-note { font-size: 15px; margin-bottom: 12px; }
  .video-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: #222;
    margin-bottom: 14px;
  }
  .video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .unlock-btn {
    display: block;
    width: 100%;
    font-size: 22px;
    padding: 16px;
    background: var(--gold);
    color: var(--ink);
    border-color: #b98a1f;
    box-shadow: 0 5px 0 #b98a1f;
    margin-bottom: 12px;
    animation: glow 1.6s ease-in-out infinite;
  }
  .unlock-btn:hover { background: #f2c85e; }
  @keyframes glow {
    0%, 100% { box-shadow: 0 5px 0 #b98a1f, 0 0 0 0 rgba(233, 185, 73, 0.6); }
    50% { box-shadow: 0 5px 0 #b98a1f, 0 0 0 10px rgba(233, 185, 73, 0); }
  }
  /* 小遊戲佔位區：之後擴充「大野狼的單字打字機」就放在這個 div 裡 */
  #minigame {
    display: none;
    padding: 30px 16px;
    margin-bottom: 14px;
    border-radius: 10px;
    background: #2b1d2f;
    color: #f1d9a0;
    font-size: 20px;
    font-weight: 700;
  }
  #minigame.show { display: block; }

  @media (max-width: 600px) {
    #scene-label, #info-err { display: none; }
    .sprite { bottom: 27%; }
    #npc { width: 175px; height: 285px; right: 4%; }
    #red { width: 130px; height: 205px; left: 4%; }
    #boss-hp { width: 175px; right: 4%; bottom: calc(27% + 292px); }
    #red-hearts { width: 130px; left: 4%; bottom: calc(27% + 210px); font-size: 20px; }
    .fx-word { font-size: 32px; }
    .q-line { font-size: 16px; line-height: 2; }
    .word-input { width: 92px; font-size: 16px; }
    .btn { font-size: 17px; padding: 10px 18px; }
    #text { font-size: 18px; }
    #dialogue { padding: 26px 18px 20px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="game">

  <!-- 主視覺區：背景 + 角色立繪 -->
  <div id="stage" class="scene-home">
    <!-- Red（小紅帽）立繪佔位 -->
    <div id="red" class="sprite dim"><span class="sprite-label">Red 小紅帽</span></div>

    <!-- NPC 立繪佔位：Mom / 戴口罩的大野狼奶奶共用這個 div -->
    <div id="npc" class="sprite char-mom state-normal">
      <span id="npc-label" class="sprite-label">Mom 媽媽</span>
    </div>

    <!-- Boss 戰：大野狼血條（3 格） -->
    <div id="boss-hp"><span>HP</span><span class="seg"></span><span class="seg"></span><span class="seg"></span></div>

    <!-- Boss 戰：小紅帽愛心條 -->
    <div id="red-hearts"></div>
  </div>

  <!-- Boss 戰動作特效圖層 -->
  <div id="fx"></div>

  <!-- Boss 戰困難以上的紅色警戒濾鏡 -->
  <div class="danger-filter"></div>

  <!-- 互動式廚房層架：關卡 3～5 才出現，物品依關卡設定（STAGES 的 shelf） -->
  <div id="kitchen-shelf"></div>

  <!-- 點擊合成的動畫卡片 -->
  <div id="craft-fx">
    <div class="craft-card">
      <div class="craft-icons"><span class="craft-container"></span><span class="craft-food"></span></div>
      <div class="craft-caption"></div>
      <div class="craft-sub"></div>
    </div>
  </div>

  <!-- 上方常駐控制列 -->
  <div id="topbar">
    <span id="scene-label" class="top-tag">場景：Red 的家</span>
    <span class="spacer"></span>
    <span id="info-stage" class="top-tag">準備中</span>
    <span id="info-err" class="top-tag">答錯 0 次</span>
    <span id="info-favor" class="top-tag" hidden></span>
    <button id="mute-btn" class="top-tag top-btn" type="button">🔊 語音開</button>
    <button id="home-btn" class="top-tag top-btn" type="button" title="回到主頁 (Home)">🏠<span class="btn-long"> 回到主頁 (Home)</span></button>
  </div>

  <!-- 互動面板：只在需要作答時出現 -->
  <div id="panel" class="hidden"></div>

  <!-- 對話框 -->
  <div id="dialogue">
    <div id="speaker" class="narr">旁白</div>
    <div id="text"></div>
    <div id="sub"></div>
    <div id="next-arrow">▼</div>
    <!-- 教學圖解：台詞帶 icon 欄位時顯示在對話框右側 -->
    <div id="dialogue-icon"></div>
  </div>

  <!-- 開場畫面 -->
  <div id="title-screen" class="overlay show">
    <h1>小紅帽的森林外送任務</h1>
    <div class="en">Red's Delivery Mission · Unit 4</div>
    <p class="desc">奶奶生病了，Red 要幫她送食物。<br>可是……這個戴口罩的奶奶，要求好像越來越多？<br>用正確的英文量詞闖過五個關卡，最後打倒大野狼吧！</p>
    <button class="btn" id="start-btn" type="button">Start Game (開啟音效)</button>
    <div class="note">建議戴耳機或打開喇叭，每個角色都有自己的聲音喔</div>
  </div>

  <!-- Boss 戰失敗畫面 -->

  <!-- VHS 倒轉回歸：把這關剛才的畫面往回倒帶 -->

  <!-- 結算畫面 -->

</div>

<script>
/* =========================================================
 * 〇、可調整的設定
 * ========================================================= */

// 均一平台教學影片：貼上 YouTube 嵌入網址，例如 'https://www.youtube.com/embed/影片ID'
// 結算時依錯最多的類型推播；留空字串時顯示佔位框
const JUNYI_VIDEO_PLURAL_URL = 'https://www.junyiacademy.org/video/IcFWi-do0Lw?parent-topic-id=educloudjun-e1';           // 名詞複數與容器量詞規則
const JUNYI_VIDEO_UNCOUNTABLE_URL = 'https://www.junyiacademy.org/video/6lToU6Hnzx4?parent-topic-id=grammar-lexicalunit-1'; // 可數與不可數名詞判斷

// 均一的網頁不能直接嵌進 iframe，但網址裡那 11 碼就是均一官方頻道的 YouTube 影片 ID，
// 所以抽出 ID 改用 YouTube 嵌入播放；均一原網址留給下方的「到均一平台觀看」按鈕
function toEmbedUrl(url) {
  const m = url.match(/(?:video\/|v=|embed\/|youtu\.be\/)([\w-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}?rel=0` : url;
}

// Boss 戰難度（開打前由玩家選）：倒數是「每一招各自計時」，擊中一招就重置
//   time：每招秒數；creep：大野狼逼近速度（px／秒）；penalty：打錯一個字母扣幾秒；hint：顯示每個字的頭尾字母
const DIFFICULTY = {
  easy: { name: '簡單 Easy', time: 20, creep: 4, penalty: 0, hint: true, desc: '每招 20 秒・提示每個字的頭尾字母' },
  normal: { name: '普通 Normal', time: 15, creep: 6, penalty: 0, hint: false, desc: '每招 15 秒・全底線盲打' },
  hard: { name: '困難 Hard', time: 10, creep: 9, penalty: 2, hint: false, desc: '每招 10 秒・打錯一個字母扣 2 秒' }
};
const RED_MAX_HEARTS = 3;          // 小紅帽愛心條的格數（目前盲打戰不扣愛心，只靠倒數判定）

// 死亡次數：Boss 戰倒數歸零、或生命值歸零都算一次；結算稱號依它決定
let deathCount = 0;
// 「再次挑戰」時的倒轉音效：把檔案放在 assets 資料夾；找不到就改用程式合成的倒帶聲
const REWIND_SOUND_URL = 'assets/re0-respawn.mp3';

// Boss 戰音樂：把音樂檔放在 index.html 同一個資料夾，檔名改成這裡寫的名字即可（mp3 / ogg / m4a 都行）
// 也可以填完整網址；留空字串就不播音樂
const BATTLE_MUSIC_URL = 'battle.mp3';
const BATTLE_MUSIC_VOLUME = 0.35;   // 0～1，太大聲會蓋過角色語音

// 音效總開關（右上角按鈕切換，語音與音樂一起開關）
let soundOn = true;

// 錯題紀錄（去重）：key 是題目代號，value 是這題最後一次犯的錯誤類別
//   同一題重複答錯只會覆蓋，不會重複計分；追加題是額外練習，不記錄
//   題目代號：關卡 1 '1-bread'、關卡 2 '2-popcorn'、關卡 3、4 '3-salad-container'（選容器）／'3-salad-plural'（選單複數）、
//             Boss 戰 '5-attack1'～'5-attack3'（以招式順序當代號，死亡重抽題目也不會超過 3 題）
//   類別：單複數（忘記加 s、多加 s、glass 的 es）、可數與不可數（How much / How many）、
//         用錯量詞（容器選錯、意思跟中文提示對不上）、拼字錯誤（拼錯、亂碼、留白、Boss 戰打錯字母）
let errorRecords = {};

// 各類別的總題數（分母）：算「有機會犯這類錯的題目」有幾題，一題可能同時算進好幾類
//   單複數       6 = 關卡 1 填空 2（a 後面多加 s）＋ 關卡 3、4 選單複數 4
//   可數與不可數 2 = 關卡 2 的 2 題
//   用錯量詞     6 = 關卡 1 填空 2 ＋ 關卡 3、4 選容器 4
//   拼字錯誤     5 = 關卡 1 填空 2 ＋ Boss 戰 3 招
const TOTAL_QUESTIONS = {
  '單複數': 6,
  '可數與不可數': 2,
  '用錯量詞': 6,
  '拼字錯誤': 5
};

// 小紅帽生命值（0～RED_MAX_HP 顆心）：關卡 1～4 與追加題每答錯一次扣 1；扣到 0 就算死亡
//   課外但正確的單字（textbookOnly）不算答錯、不扣；Boss 戰只看倒數，不扣生命值
const RED_MAX_HP = 5;
let redHp = RED_MAX_HP;
// 去重後的總錯題數、某一類的錯題數
const errorTotal = () => Object.keys(errorRecords).length;
const errorCount = cat => Object.values(errorRecords).filter(c => c === cat).length;

/* =========================================================
 * 一、語音模組（Web Speech API：window.speechSynthesis）
 *
 * 角色聲線分離：
 *   Red、Mom → 女聲，pitch 1.2
 *   Grandma（大野狼）→ 男聲或粗獷的聲音，pitch 0.5、rate 0.9
 *   AI 家教 → 中文聲音（提示是中文）
 *   旁白 → 依文字語言決定
 *
 * 跨瀏覽器要注意的地方：
 *   1. 瀏覽器禁止自動播放：第一次發聲必須在使用者點擊之內，
 *      所以「Start Game」按鈕裡先唸一段空字串解鎖（iOS Safari 尤其需要）。
 *   2. 語音清單是非同步載入的：一開始 getVoices() 常是空陣列，
 *      要等 onvoiceschanged 觸發再抓一次，並重新幫每個角色挑聲音。
 *   3. Android 的語言代碼是 en_US（底線），桌機是 en-US，比對前要統一。
 *   4. 找不到符合條件的聲音時，只設定 lang，交給系統挑，pitch 照樣套用。
 * ========================================================= */

// 女聲關鍵字（Windows: Zira/Aria/Jenny；macOS/iOS: Samantha/Karen…；Chrome: Google US English）
const FEMALE_HINTS = ['female', 'samantha', 'zira', 'google us english', 'aria', 'jenny', 'karen',
  'victoria', 'susan', 'tessa', 'moira', 'fiona', 'allison', 'ava', 'serena', 'libby', 'sonia', 'michelle', 'emma', 'hazel'];
// 男聲關鍵字（Windows: David/Mark/Guy；macOS: Daniel/Fred/Alex；Chrome: Google UK English Male）
const MALE_HINTS = ['david', 'mark', 'guy', 'daniel', 'fred', 'alex', 'george', 'ryan', 'christopher', 'eric', 'james', 'tom', 'rishi'];

// 每個角色的聲音設定
const VOICE_PROFILE = {
  red:     { lang: 'en-US', gender: 'female', pitch: 1.2, rate: 0.95 },
  mom:     { lang: 'en-US', gender: 'female', pitch: 1.2, rate: 0.95 },
  grandma: { lang: 'en-US', gender: 'male',   pitch: 0.5, rate: 0.9 },
  narr:    { lang: 'en-US', gender: null,     pitch: 1.0, rate: 0.95 },
  tutor:   { lang: 'zh-TW', gender: null,     pitch: 1.0, rate: 1.05 }
};

const speech = {
  supported: 'speechSynthesis' in window,
  enabled: false,
  voices: [],
  cache: {},                     // 角色 → 已挑好的 voice

  norm(v) { return v.lang.replace('_', '-').toLowerCase(); },

  isFemale(v) {
    const n = v.name.toLowerCase();
    return FEMALE_HINTS.some(k => n.includes(k));
  },
  isMale(v) {
    const n = v.name.toLowerCase();
    // 'female' 也含有 'male'，所以要用單字邊界判斷
    return /\bmale\b/.test(n) || MALE_HINTS.some(k => n.includes(k));
  },

  loadVoices() {
    if (!this.supported) return;
    this.voices = window.speechSynthesis.getVoices();
    this.cache = {};             // 清單變了，角色要重新挑聲音
  },

  // 中文聲音：台灣口音優先，其次香港、中國
  pickChinese() {
    for (const code of ['zh-tw', 'zh-hk', 'zh-cn']) {
      const v = this.voices.find(x => this.norm(x) === code);
      if (v) return v;
    }
    return this.voices.find(x => this.norm(x).startsWith('zh')) || null;
  },

  // 英文聲音：先找美式、再找任何英文；依性別過濾
  pickEnglish(gender) {
    const en = this.voices.filter(v => this.norm(v).startsWith('en'));
    const us = en.filter(v => this.norm(v) === 'en-us');
    const pools = [us, en];
    for (const pool of pools) {
      let v = null;
      if (gender === 'female') v = pool.find(x => this.isFemale(x));
      if (gender === 'male') v = pool.find(x => this.isMale(x) && !this.isFemale(x));
      if (v) return v;
    }
    // 找不到指定性別：女聲退而求其次挑「不是男聲」的，男聲挑「不是女聲」的
    if (gender === 'female') return us.find(x => !this.isMale(x)) || en[0] || null;
    if (gender === 'male') return us.find(x => !this.isFemale(x)) || en[0] || null;
    return us[0] || en[0] || null;
  },

  voiceFor(character, lang) {
    const key = character + '|' + lang;
    if (!(key in this.cache)) {
      const profile = VOICE_PROFILE[character] || VOICE_PROFILE.narr;
      this.cache[key] = lang.startsWith('zh') ? this.pickChinese() : this.pickEnglish(profile.gender);
    }
    return this.cache[key];
  },

  // 在使用者點擊時呼叫：解鎖自動播放限制並載入聲音
  unlock() {
    if (!this.supported) return;
    this.enabled = true;
    this.loadVoices();
    window.speechSynthesis.onvoiceschanged = () => this.loadVoices();
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    window.speechSynthesis.speak(u);
  },

  stop() {
    if (this.supported) window.speechSynthesis.cancel();
  }
};

/**
 * 全域語音函式：依角色決定聲音、音調、語速
 * @param {string} text      要唸的文字
 * @param {string} character red / mom / grandma / tutor / narr
 */
function speakText(text, character = 'narr') {
  if (!speech.supported || !speech.enabled || !text) return;
  // 括號與底線不唸（例如旁白的 (Red goes to the kitchen.)）
  const clean = text
    .replace(/<[^>]+>/g, '')                                         // 不唸 HTML 標籤
    .replace(/[（(][^()（）]*[\u4e00-\u9fff][^()（）]*[)）]/g, ' ')   // 英文台詞裡的中文註解不唸，免得整句被切成中文語音
    .replace(/[()（）_]/g, ' ')
    .trim();
  if (!clean) return;

  const profile = VOICE_PROFILE[character] || VOICE_PROFILE.narr;
  // 文字含中文就一定用中文聲音（例如家教提示、中文旁白）
  const isZh = /[一-鿿]/.test(clean);
  const lang = isZh ? 'zh-TW' : profile.lang;

  const u = new SpeechSynthesisUtterance(clean);
  u.lang = lang;
  const voice = speech.voiceFor(character, lang);
  if (voice) u.voice = voice;
  // 角色的音調只套在英文台詞；中文一律用家教的設定，避免中文被壓成怪聲聽不清楚
  const p = isZh ? VOICE_PROFILE.tutor : profile;
  u.pitch = p.pitch;
  u.rate = p.rate;

  // 先停掉上一句，避免點太快時語音排隊、跟畫面對不上
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

/* =========================================================
 * 一之二、戰鬥音樂
 *   Boss 現身時從頭循環播放，打倒大野狼後淡出，回到主頁時停止。
 *   iOS Safari 要求聲音必須「曾經在點擊裡播過」才能之後自動播，
 *   所以在 Start Game 按鈕裡先靜音播一下再暫停（prime）。
 *   音樂檔不存在時只在主控台留訊息，遊戲照常進行。
 * ========================================================= */
const music = {
  el: null,
  fadeTimer: null,

  ensure() {
    if (!BATTLE_MUSIC_URL) return null;
    if (!this.el) {
      this.el = new Audio(BATTLE_MUSIC_URL);
      this.el.loop = true;
      this.el.preload = 'auto';
      this.el.addEventListener('error', () => console.info(`找不到戰鬥音樂檔：${BATTLE_MUSIC_URL}（不影響遊戲）`));
    }
    return this.el;
  },

  // 在使用者點擊時呼叫，解鎖之後的自動播放
  prime() {
    const el = this.ensure();
    if (!el) return;
    el.muted = true;
    el.play().then(() => { el.pause(); el.currentTime = 0; el.muted = !soundOn; }).catch(() => { el.muted = !soundOn; });
  },

  play() {
    const el = this.ensure();
    if (!el) return;
    clearInterval(this.fadeTimer);
    el.muted = !soundOn;
    el.volume = BATTLE_MUSIC_VOLUME;
    el.currentTime = 0;
    el.play().catch(() => {});
  },

  // 音量逐步降到 0 後暫停
  fadeOut(ms = 2500) {
    const el = this.el;
    if (!el || el.paused) return;
    clearInterval(this.fadeTimer);
    const step = el.volume / (ms / 100);
    this.fadeTimer = setInterval(() => {
      el.volume = Math.max(0, el.volume - step);
      if (el.volume <= 0) { clearInterval(this.fadeTimer); el.pause(); }
    }, 100);
  },

  stop() {
    clearInterval(this.fadeTimer);
    if (this.el) { this.el.pause(); this.el.currentTime = 0; }
  },

  setMuted(m) {
    if (this.el) this.el.muted = m;
  }
};

/* =========================================================
 * 一之三、正確音效
 *   用 Web Audio 合成「叮咚」兩個音，不需要音檔。
 *   AudioContext 一樣要在使用者點擊時建立（Start Game 按鈕裡呼叫 unlock）。
 * ========================================================= */
const sfx = {
  ctx: null,

  unlock() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ctx) this.ctx = new AC();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },

  // 單一個音：頻率、開始時間、長度
  tone(freq, start, dur) {
    const c = this.ctx;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, c.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(0.25, c.currentTime + start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(c.currentTime + start);
    osc.stop(c.currentTime + start + dur + 0.05);
  },

  // 單一個滑音：從 freq 滑到 to，type 是波形
  blip(freq, to, dur, type = 'triangle', vol = 0.15) {
    if (!soundOn || !this.ctx) return;
    const c = this.ctx;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, c.currentTime);
    osc.frequency.exponentialRampToValueAtTime(to, c.currentTime + dur);
    gain.gain.setValueAtTime(vol, c.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    osc.connect(gain).connect(c.destination);
    osc.start();
    osc.stop(c.currentTime + dur + 0.05);
  },
  rewind() { this.blip(1500, 160, 1.4, 'sawtooth', 0.1); this.blip(900, 90, 1.4, 'square', 0.05); },   // 倒帶聲
  // 一小段白噪音，經過濾波器（type：bandpass 清脆、lowpass 悶）—— 打擊感的「啪」靠它
  noise(dur, freq, type = 'bandpass', vol = 0.25, q = 1.2) {
    if (!soundOn || !this.ctx) return;
    const c = this.ctx;
    if (!this.noiseBuf) {
      this.noiseBuf = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = c.createBufferSource();
    src.buffer = this.noiseBuf;
    const filter = c.createBiquadFilter();
    filter.type = type;
    filter.frequency.value = freq;
    filter.Q.value = q;
    const gain = c.createGain();
    gain.gain.setValueAtTime(vol, c.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    src.connect(filter).connect(gain).connect(c.destination);
    src.start();
    src.stop(c.currentTime + dur + 0.02);
  },
  /*
   * 打對一個字母：三層疊起來的打擊聲
   *   低頻重擊（咚）＋短促噪音（啪）＋叮聲；combo 是連續打對幾個，叮聲隨連擊往上升（最多一個八度）
   */
  hit(combo = 0) {
    this.blip(190, 50, 0.1, 'sine', 0.45);                         // 咚：份量
    this.noise(0.035, 3200, 'bandpass', 0.35, 0.9);                // 啪：接觸瞬間
    const step = Math.min(combo, 12);
    this.blip(660 * Math.pow(2, step / 12), 990 * Math.pow(2, step / 12), 0.06, 'triangle', 0.09);   // 叮：連擊音階
  },
  // 打錯：悶住的噪音＋破音方波，低沉的「喀」
  thud() {
    this.noise(0.14, 380, 'lowpass', 0.45, 0.8);
    this.blip(120, 45, 0.2, 'square', 0.18);
    this.blip(127, 48, 0.2, 'sawtooth', 0.08);                     // 稍微走音，聽起來像破掉
  },
  // 完成一擊：大爆炸＋重低音＋金屬尾音
  critical() {
    this.noise(0.55, 900, 'lowpass', 0.6, 0.7);
    this.blip(140, 32, 0.6, 'sine', 0.55);
    this.blip(260, 50, 0.45, 'sawtooth', 0.2);
    this.blip(1500, 400, 0.35, 'square', 0.06);
  },

  correct() {
    if (!soundOn || !this.ctx) return;
    this.tone(880, 0, 0.18);      // A5
    this.tone(1318.5, 0.12, 0.32); // E6
  }
};

/* =========================================================
 * 二、課本單字粗體
 * 對白與提示中出現的 Unit 4 單字，一律自動包 <strong>
 * ========================================================= */
const VOCAB = [
  // 片語（長的放前面，避免被拆開比對）
  'fruit salad', 'milk shake', 'milkshake', 'a little', 'all right', 'back off', 'turn into', 'Big Bad Wolf',
  // 食物與物品
  'water', 'popcorn', 'tea', 'pizzas?', 'candy', 'juice', 'bread', 'cheese', 'flour', 'salt', 'plates?',
  'sugar', 'pies?', 'meals?', 'snacks?', 'masks?', 'toast', 'things?', 'kids?', 'something',
  // 容器量詞（can 只算「罐」：cans 或 can of，助動詞 Can you 不算）
  'glass(?:es)?', 'bottles?', 'tubs?', 'bowls?', 'cups?', 'slices?', 'bags?', 'cans', 'can(?= of)',
  // 其他課本單字
  'sick', 'because', 'need', 'still', 'yummy', 'easy', 'enjoy', 'each', 'wear(?:ing)?', 'why', 'get', 'rice'
];
const VOCAB_RE = new RegExp(`\\b(?:${VOCAB.join('|')})\\b`, 'gi');

// 把一句話切成 [{ t: 文字, b: 是否粗體 }]，打字機逐字顯示時才不會把標籤打一半
function toSegments(text) {
  const segs = [];
  // 劇本裡手動標的 <strong>…</strong> 一定加粗（課本單字表以外的字，例如 loaf、piece）
  for (const part of text.split(/(<strong>.*?<\/strong>)/)) {
    if (!part) continue;
    const m = part.match(/^<strong>(.*?)<\/strong>$/);
    if (m) { segs.push({ t: m[1], b: true }); continue; }
    // 其餘文字照課本單字表自動加粗
    let last = 0;
    for (const v of part.matchAll(VOCAB_RE)) {
      if (v.index > last) segs.push({ t: part.slice(last, v.index), b: false });
      segs.push({ t: v[0], b: true });
      last = v.index + v[0].length;
    }
    if (last < part.length) segs.push({ t: part.slice(last), b: false });
  }
  return segs;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 只顯示前 n 個字，粗體部分包 <strong>
function renderSegments(segs, n = Infinity) {
  let out = '';
  let left = n;
  for (const s of segs) {
    if (left <= 0) break;
    const part = s.t.slice(0, left);
    left -= part.length;
    out += s.b ? `<strong>${escapeHtml(part)}</strong>` : escapeHtml(part);
  }
  return out;
}

/**
 * 依「食物性質 × 容器類型」決定疊法
 *   液體：玻璃杯／碗 → fill；馬克杯 → 奶昔 hidden、熱茶 fill；瓶子 → hidden；盤子／盒子／袋子／披薩片 → spill
 *   固體：碗 → 沙拉 nest、披薩 stuffed；玻璃杯／馬克杯／瓶子 → stuffed；盤子 → on；盒子／袋子 → peek
 */
function situationMode(food, c) {
  if (food === 'pizza' && c === 'slice') return 'self';
  if (FOOD_KIND[food] === 'liquid') {
    if (c === 'glass' || c === 'bowl') return 'fill';
    if (c === 'cup') return food === 'shake' ? 'hidden' : 'fill';
    if (c === 'bottle') return 'hidden';
    return 'spill';
  }
  if (c === 'bowl') return food === 'salad' ? 'nest' : 'stuffed';
  if (c === 'glass' || c === 'cup' || c === 'bottle') return 'stuffed';
  if (c === 'plate' || c === 'slice') return 'on';
  return 'peek';
}

// 一個圖層（統一 viewBox 0 0 100 100）
const sl = (content, style = '', cls = '') => `<svg class="sl ${cls}" viewBox="0 0 100 100" style="${style}" aria-hidden="true">${content}</svg>`;
// 包一層只顯示上方 pct% 的框（食物在前、杯口以下被「容器」擋住的效果）
const clipTop = (inner, pct) => `<div class="sl" style="clip-path: inset(0 0 ${100 - pct}% 0)">${inner}</div>`;
// 容器圖：冷飲或固體配馬克杯時拿掉熱氣
function containerSvg(c, food) {
  const svg = SITUATION_ASSETS.containers[c];
  return c === 'cup' && food !== 'tea' ? svg.replace(/<path d="M38 26[^>]*\/>/, '') : svg;
}

const SITUATION_BUILDERS = {

  fill: (f, c) => sl(containerSvg(c, f)) + sl(SITUATION_ASSETS.foods[f], `clip-path: ${INTERIOR[c]}`, 'food-layer')
    + (f === 'shake' && c === 'glass' ? sl(CREAM, '', 'food-layer') : '')
    + (c === 'glass' ? sl(SHINE) : '')
    + (f === 'tea' && c !== 'cup' ? sl(STEAM, 'transform: translate(0,6%)', 'steam') : ''),
  // 看不到漸層：液體放在不透明容器「後面」
  hidden: (f, c) => sl(SITUATION_ASSETS.foods[f], `clip-path: ${BODY[c]}`) + sl(containerSvg(c, f))
    + (MOUTH[c] ? sl(MOUTH[c]) : '') + '<div class="sit-badge">?</div>',
  // 灑出來：容器照畫，液體變成扁平的一攤加水滴（scaleY 0.2）
  spill: (f, c) => sl(containerSvg(c, f)) + sl(PUDDLE(f), '', 'puddle') + sl(DROPS(f), '', 'drops'),
  // 硬塞進去：食物旋轉擠壓卡在杯口；碗、杯是食物在前只露杯口以上，玻璃杯、瓶子是食物在後透出來
  stuffed: (f, c) => {
    const food = `<div class="sl wob">${sl(SITUATION_ASSETS.foods[f], `transform: ${STUFF[f][c]}`)}</div>`;
    return CLIP_TOP[c]
      ? sl(containerSvg(c, f)) + clipTop(food, CLIP_TOP[c])
      : food + sl(containerSvg(c, f), c === 'glass' ? 'opacity: .62' : '') + (c === 'glass' ? sl(SHINE) : '');
  },
  // 沙拉裝在碗裡（正確）
  nest: (f, c) => sl(containerSvg(c, f)) + clipTop(sl(SITUATION_ASSETS.foods[f], 'transform: translate(0,-6%) scale(.92,.8)', 'food-layer'), CLIP_TOP.bowl),

  peek: (f, c) => sl(SITUATION_ASSETS.foods[f], `transform: ${PEEK[f]}`) + sl(containerSvg(c, f)),

  self: f => sl(SITUATION_ASSETS.foods[f], '', 'food-layer')

/**
 * 組合情境圖
 * @param {string|null} food      salad / shake / pizza / tea；沒有食物（Boss 戰）就只畫容器
 * @param {string}      container 層架物品名稱
 * @returns {HTMLDivElement}
 */
function renderSituation(food, container) {
  const el = document.createElement('div');
  if (!food || !SITUATION_ASSETS.foods[food]) {
    el.className = 'situation sit-solo';
    el.innerHTML = sl(ICONS[SHELF_ITEMS[container].icon]);
    return el;
  }
  const mode = situationMode(food, container);
  el.className = `situation sit-${mode}`;
  el.dataset.mode = mode;
  el.innerHTML = SITUATION_BUILDERS[mode](food, container);
  return el;
}

// 卡片下方的小字（依疊法描述發生了什麼）
function situationNote(food, c, ok) {
  if (ok || !food) return '';
  const mode = situationMode(food, c);
  if (mode === 'fill') return food === 'tea' ? (c === 'glass' ? '（熱茶倒進玻璃杯，好燙！）' : '（這是喝湯的碗吧……）') : '（奶昔要用舔的嗎……）';
  return {
    hidden: '（完全看不到漂亮的漸層……）', spill: '（全灑出來了……）', stuffed: '（硬塞進去了……）',
    on: food === 'salad' ? '（沙拉醬流得滿桌都是……）' : '（整盤端上來，不是一片一片的……）',
    peek: '（被蓋住了，拿不到……）'
  }[mode] || '';
}
